[project]
name = "usersim"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "httpx>=0.28.0",
    "pydantic>=2.0",
    "typing-extensions==4.15.0",
    "browser-use==0.13.8",
    "browserbase>=1.0.0",
    "playwright>=1.62.0",
    "mangum>=0.19.0",
    # browser-use 0.13.8 pins google-auth==2.48.0 — do not upper-bound below that
    # or Vercel installs fail. Fleet Spot copies use metadata tokens directly.
    "google-auth>=2.48",
    "google-cloud-storage>=2.14.0",
    "google-cloud-compute>=1.19.0",
]
