<style>
/* Layout: an observation room. Summary strip, then the replay theatre (the hero), then paths, voices, splits, and the ship list. */
:root{
  --bg:#f6f7f9; --panel:#ffffff; --ink:#15171c; --muted:#5d6472; --line:#e1e4ea; --sunk:#eef0f4;
  --accent:#2d4bd8; --accent-ink:#ffffff; --hi:#ffe68a; --hi-ink:#4a3b00;
  --ok:#1f8a56; --warn:#b26b00; --bad:#c23b3b;
  --t0:#59606e; --t1:#d4572a; --t2:#2d8f8a; --t3:#8a4fd1;
  --display:"Bricolage Grotesque",ui-sans-serif,system-ui,sans-serif;
  --body:"Geist",ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:"Geist Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
  --r:10px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0f1115; --panel:#171a20; --ink:#e9ebf0; --muted:#9aa2b1; --line:#2a2f39; --sunk:#1d2129;
  --accent:#7c93ff; --accent-ink:#0f1115; --hi:#5a4a10; --hi-ink:#ffe9a6;
  --ok:#4cc38a; --warn:#e7a43b; --bad:#ef7b7b;
  --t0:#a3abb9; --t1:#ff8a5c; --t2:#4fc9c2; --t3:#b48cff; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0f1115; --panel:#171a20; --ink:#e9ebf0; --muted:#9aa2b1; --line:#2a2f39; --sunk:#1d2129;
  --accent:#7c93ff; --accent-ink:#0f1115; --hi:#5a4a10; --hi-ink:#ffe9a6;
  --ok:#4cc38a; --warn:#e7a43b; --bad:#ef7b7b;
  --t0:#a3abb9; --t1:#ff8a5c; --t2:#4fc9c2; --t3:#b48cff; color-scheme:dark}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{background:var(--bg);color:var(--ink);font:15px/1.55 var(--body);margin:0}
.wrap{max-width:1240px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:28px 80px;display:grid;gap:44px}
h1,h2,h3{font-family:var(--display);text-wrap:balance;margin:0;letter-spacing:-.01em}
h1{font-size:clamp(26px,4vw,38px);line-height:1.1;font-weight:700}
h2{font-size:22px;font-weight:700}
h3{font-size:16px;font-weight:600;font-family:var(--body)}
.eyebrow{font:500 12px/1 var(--mono);letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.muted{color:var(--muted)}
.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}
section>header{display:flex;align-items:baseline;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:14px}
section>header p{margin:4px 0 0;color:var(--muted);max-width:68ch}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

/* top */
.top{display:grid;gap:16px}
.top .lede{font-size:17px;max-width:72ch;margin:0}
.who{display:flex;gap:8px;flex-wrap:wrap}
.chip{display:inline-flex;align-items:center;gap:6px;padding:4px 10px;border-radius:99px;background:var(--panel);border:1px solid var(--line);font-size:13px;white-space:nowrap}
.dot{width:9px;height:9px;border-radius:50%;flex:none}
.matrix{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);overflow-x:auto}
.matrix table{border-collapse:collapse;width:100%;min-width:560px}
.matrix th,.matrix td{padding:10px 14px;text-align:left;border-bottom:1px solid var(--line);font-size:14px;vertical-align:middle}
.matrix tr:last-child td{border-bottom:0}
.matrix th{font:500 12px var(--mono);color:var(--muted);letter-spacing:.04em}
.matrix td.cell{cursor:pointer}
.matrix td.cell:hover{background:var(--sunk)}
.out{display:inline-flex;align-items:center;gap:6px;font-weight:600}
.out.completed{color:var(--ok)}.out.gave_up{color:var(--warn)}.out.blocked,.out.not_run{color:var(--bad)}
.sub{font:12px var(--mono);color:var(--muted)}

/* theatre */
.theatre{display:grid;grid-template-columns:minmax(0,1fr) 330px;gap:16px}
@media (max-width:900px){.theatre{grid-template-columns:1fr}}
.stagebox{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:12px;display:grid;gap:10px;min-width:0}
.pick{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.seg button{border:0;background:transparent;padding:6px 10px;font-size:13px}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.screen{position:relative;width:100%;aspect-ratio:16/10;max-width:100%;border-radius:8px;overflow:hidden;background:var(--sunk);border:1px solid var(--line)}
.shot{position:absolute;inset:0;background-repeat:no-repeat;background-size:100% auto}
.ripple{position:absolute;width:34px;height:34px;margin:-17px 0 0 -17px;border-radius:50%;border:3px solid var(--accent);box-shadow:0 0 0 6px color-mix(in srgb,var(--accent) 25%,transparent);pointer-events:none}
.ripple.anim{animation:rip .9s ease-out}
@keyframes rip{0%{transform:scale(.3);opacity:0}30%{opacity:1}100%{transform:scale(1);opacity:1}}
.typed{position:absolute;left:12px;bottom:12px;max-width:70%;background:var(--ink);color:var(--bg);font:12px var(--mono);padding:5px 8px;border-radius:6px}
.bar{display:flex;align-items:center;gap:10px}
.bar .play{width:36px;height:36px;border-radius:50%;border:0;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;flex:none}
.ticks{position:relative;flex:1;height:30px;display:flex;gap:2px;align-items:stretch;min-width:0}
.tick{flex:1;border:0;padding:0;border-radius:3px;background:var(--sunk);position:relative}
.tick.fr{background:color-mix(in srgb,var(--bad) 55%,var(--sunk))}
.tick.dv{background:var(--hi)}
.tick.on{outline:2px solid var(--ink);outline-offset:1px}
.stepn{font:12px var(--mono);color:var(--muted);white-space:nowrap}
.side{display:grid;gap:12px;align-content:start;min-width:0}
.think{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:14px;display:grid;gap:8px}
.think blockquote{margin:0;font-size:17px;line-height:1.45}
.act{font:12px var(--mono);color:var(--muted)}
.flag{display:inline-flex;gap:6px;align-items:center;font-size:12px;font-weight:600;padding:3px 8px;border-radius:6px;background:var(--hi);color:var(--hi-ink);width:max-content;max-width:100%}
.flag.fr{background:color-mix(in srgb,var(--bad) 18%,var(--panel));color:var(--bad)}
.persona{background:var(--sunk);border-radius:var(--r);padding:12px;font-size:13px;display:grid;gap:4px}
.compare{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.compare .screen{aspect-ratio:16/10}
.compare figcaption{font:12px var(--mono);color:var(--muted);margin-top:4px}

/* paths */
.paths{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:16px;overflow-x:auto}
.paths svg{display:block}
.paths text{fill:var(--muted);font:11px var(--mono)}
.paths .lane-label{fill:var(--ink);font:500 12px var(--body)}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--muted);margin-top:10px}

/* voices */
.voices{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:14px}
.voice{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:16px;display:grid;gap:10px;align-content:start;border-top:4px solid var(--c)}
.voice .size{font:12px var(--mono);color:var(--muted)}
.q{margin:0;padding-left:12px;border-left:2px solid var(--line);font-size:14px;cursor:pointer}
.q:hover{border-left-color:var(--c)}
.q small{display:block;color:var(--muted);font:11px var(--mono);margin-top:2px}
.tagrow{display:flex;gap:6px;flex-wrap:wrap}
.tag{font:11px var(--mono);padding:2px 7px;border-radius:5px;background:var(--sunk);color:var(--muted)}

/* splits + variations */
.splits{display:grid;gap:14px}
.split{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:16px;display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.25fr);gap:16px}
@media (max-width:820px){.split{grid-template-columns:1fr}}
.sev{font:600 11px var(--mono);letter-spacing:.06em;text-transform:uppercase}
.sev.high{color:var(--bad)}.sev.med{color:var(--warn)}.sev.low{color:var(--muted)}
.ba{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.ba .screen{aspect-ratio:16/10}
.ba figcaption{font:11px var(--mono);color:var(--muted);margin-top:4px}
.mock{position:absolute;border-radius:6px;white-space:nowrap;box-shadow:0 0 0 2px var(--accent),0 6px 18px rgba(0,0,0,.18);display:grid;place-items:center;text-align:center;font:600 12px/1.25 var(--body);padding:4px 6px;overflow:hidden}
 .var-card{display:grid;gap:8px}
.zoom{position:relative;width:100%;max-width:100%;overflow:hidden;border-radius:8px;border:1px solid var(--line);background:var(--sunk);cursor:ew-resize;touch-action:none;user-select:none}
.zlayer{position:absolute;inset:0;overflow:hidden}
.zin{position:absolute;container-type:inline-size}
.zin .mock{font-size:1.15cqw;line-height:1.2}
.zhandle{position:absolute;top:0;bottom:0;width:2px;background:var(--accent);box-shadow:0 0 0 1px var(--panel);pointer-events:none}
.zhandle::after{content:"⇆";position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);width:28px;height:28px;border-radius:50%;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;font-size:14px}
.zlab{position:absolute;top:8px;font:600 11px var(--mono);padding:2px 6px;border-radius:4px;background:var(--ink);color:var(--bg);pointer-events:none}
.zlab.l{left:8px}.zlab.r{right:8px;background:var(--accent);color:var(--accent-ink)}
.zrange{width:100%;accent-color:var(--accent)}
.decide{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.decide button{border:1px solid var(--line);background:var(--panel);padding:7px 12px;border-radius:8px;font-size:13px;font-weight:500}
.decide button.yes[aria-pressed="true"]{background:var(--ok);border-color:var(--ok);color:var(--panel)}
.decide button.no[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:var(--bg)}
.decide .who-dec{font-size:12px;color:var(--muted)}
.ship{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:16px}
.ship ol{margin:8px 0 0;padding-left:20px;display:grid;gap:6px}
.trust{font-size:13px;color:var(--muted);border-top:1px solid var(--line);padding-top:14px;max-width:90ch}
.linkbtn{background:none;border:0;padding:0;color:var(--accent);text-decoration:underline;text-underline-offset:2px}
@media (prefers-reduced-motion:reduce){.ripple.anim{animation:none}html{scroll-behavior:auto}}
@media (max-width:520px){.compare,.ba{grid-template-columns:1fr}}
</style>

belling", "14": "Labelling", "15": "Labelling", "16": "Connecting", "17": "Connecting", "18": "Connecting", "19": "Connecting", "20": "Share dead end", "21": "Share dead end", "22": "Sign-in & captcha", "23": "Sign-in & captcha", "24": "Sign-in & captcha", "25": "Sign-in & captcha", "26": "Email code & terms", "27": "Email code & terms", "28": "Email code & terms", "29": "Share dialog", "30": "Link copied"}}, "voices": {"plain-tester": {"summary": "Found the Ctrl + arrow shortcut first and built the chart in two keypresses, then labelled. Stopped to think at the share choice.", "quotes": [{"run": "plain-tester__task1", "step": 4, "kind": "delight", "text": "That worked great, a second box with a bound arrow, and the new box is selected."}, {"run": "plain-tester__task1", "step": 14, "kind": "friction", "text": "The purple icon top-right looks like a share icon (no text label though; Miro and FigJam say \"Share\")."}, {"run": "plain-tester__comp1", "step": 24, "kind": "competitor", "text": "Clicking the share icon did nothing visible: no popover, no 'link copied' toast. That's a bit broken from a tester's view."}], "expects": ["Labelled Share button (Miro, FigJam)", "One link with view/edit choice (Google Docs)"]}, "group-1": {"summary": "Loved the no-account start and the end-to-end encryption story. Wanted a short live link like Figma or Loom, and saw only a long read-only snapshot.", "quotes": [{"run": "group-1__task1", "step": 7, "kind": "delight", "text": "That's slick: one shortcut gave me a new box plus a bound arrow. Way faster than drawing connectors in Miro."}, {"run": "group-1__task1", "step": 16, "kind": "friction", "text": "Got a link instantly, no account. Only question: it's a static snapshot, so edits after this won't show up."}, {"run": "group-1__comp1", "step": 28, "kind": "competitor", "text": "No link option anonymously. Excalidraw gives a shareable link without an account, so this is a step back."}], "expects": ["Short live link (Figma, Loom)", "Slack / Notion embeds", "Privacy story: met"]}, "group-2": {"summary": "Called the keyboard flowchart the standout and the encrypted link a real differentiator. Went looking for pricing, limits and API access and found none.", "quotes": [{"run": "group-2__task1", "step": 7, "kind": "delight", "text": "Wow, that created a connected box with a bound arrow in one keystroke, faster than draw.io."}, {"run": "group-2__task1", "step": 16, "kind": "friction", "text": "Read-only, no indication of how long the link lives or any API/GitHub embed. I'd need Excalidraw+ for that, and pricing isn't visible."}, {"run": "group-2__comp1", "step": 32, "kind": "competitor", "text": "'Anyone with the link: Editor' by default. That's more open than Figma's default, but it's what I want for a teammate."}], "expects": ["Pricing and plan limits", "API / GitHub integration", "Mermaid-like speed: met"]}, "group-3": {"summary": "Skipped the labels, used the shortcut, and had a link in 8 steps. The fastest run of the session, and the one most likely to leave if anything had blocked it.", "quotes": [{"run": "group-3__task1", "step": 4, "kind": "delight", "text": "Whoa, that's slick, it made a second box already connected with an arrow."}, {"run": "group-3__task1", "step": 3, "kind": "friction", "text": "My box ended up further left than I dragged and half hidden under the style panel, a bit weird."}, {"run": "group-3__comp1", "step": 21, "kind": "competitor", "text": "That icon only gives Export as an image, and the preview is a weird pinkish strip. Kinda annoying, Excalidraw lets me share without an account."}], "expects": ["Value before signup: met", "Is there an iOS app?", "Is it open source?"]}}, "divergences": [{"id": "d1", "severity": "high", "kind": "competitor", "title": "tldraw makes everyone sign in to share. Excalidraw doesn't, and nobody on Excalidraw was told that's special.", "summary": "On tldraw, all 4 testers drew as fast as on Excalidraw, then spent 12 to 15 extra steps on a sign-in wall, a captcha and an email code. Makers were blocked outright. On Excalidraw no tester got a cue that 'no account needed' is the difference.", "groups": ["group-1", "group-2", "group-3", "plain-tester"], "moments": [{"run": "group-1__comp1", "step": 33}, {"run": "group-3__task1", "step": 6}], "variations": ["v1"]}, {"id": "d2", "severity": "high", "kind": "expectation", "title": "Live session or read-only link? Testers guessed which one a teammate needs.", "summary": "3 of 4 chose 'Export to Link' and then wondered whether later edits would show. Makers expected a live link like Figma or Loom, which tldraw gives by default ('Anyone with the link: Editor').", "groups": ["plain-tester", "group-1", "group-2"], "moments": [{"run": "plain-tester__task1", "step": 15}, {"run": "group-1__task1", "step": 16}], "variations": ["v2", "v3"]}, {"id": "d3", "severity": "med", "kind": "shared", "title": "The Share button is an icon with no word on it.", "summary": "All 4 testers hesitated at the top-right icon and found it by position and colour. Figma, Miro and FigJam all label it 'Share'.", "groups": ["plain-tester", "group-1", "group-2", "group-3"], "moments": [{"run": "plain-tester__task1", "step": 14}, {"run": "group-3__task1", "step": 5}], "variations": ["v4"]}, {"id": "d4", "severity": "med", "kind": "path", "title": "Observers found the flowchart shortcut first and finished in 8 steps. Makers and Innovators labelled box by box first.", "summary": "The 'Ctrl + arrows' hint is the fastest path in the product, but it is a faint grey line. Testers who saw it before labelling finished in half the steps.", "groups": ["group-3", "group-1", "group-2"], "moments": [{"run": "group-3__task1", "step": 3}, {"run": "group-1__task1", "step": 3}], "variations": ["v5"]}, {"id": "d5", "severity": "low", "kind": "expectation", "title": "Innovators looked for pricing, limits and API access, and found nothing.", "summary": "Before adopting for a team, Tech Innovators wanted to know how long links last, what Excalidraw+ adds, and whether there is an API. The share flow says none of it.", "groups": ["group-2"], "moments": [{"run": "group-2__task1", "step": 16}], "variations": ["v6"]}, {"id": "d6", "severity": "low", "kind": "shared", "title": "The style panel covers the canvas while you draw.", "summary": "The first box landed half under the panel for Observers; Makers called the panel 'a lot of options' for a box.", "groups": ["group-3", "group-1"], "moments": [{"run": "group-3__task1", "step": 3}, {"run": "group-1__task1", "step": 2}], "variations": ["v7"]}], "variations": [{"id": "v1", "title": "Say 'No account needed' on the link option", "for": ["group-1", "group-2", "group-3", "plain-tester"], "change": "Add a line under 'Shareable link' in the share dialog: no account, nothing to sign. It turns the gap with tldraw into something people notice.", "before": {"run": "plain-tester__task1", "step": 14}, "overlays": [{"x": 405, "y": 512, "w": 470, "h": 38, "label": "Read-only link \u00b7 no account needed \u00b7 ready in 1 click", "bg": "var(--panel)", "fg": "var(--ink)"}]}, {"id": "v2", "title": "Spell out what a teammate gets from each option", "for": ["plain-tester", "group-1", "group-2"], "change": "Rename 'Start session' to say what it is (a live link teammates can edit), so people stop guessing between the two.", "before": {"run": "plain-tester__task1", "step": 14}, "overlays": [{"x": 500, "y": 336, "w": 282, "h": 54, "label": "Copy live link \u00b7 teammates edit with you"}]}, {"id": "v3", "title": "Tell people the snapshot won't update", "for": ["group-1", "group-2"], "change": "In the link dialog, add one line under the link: later edits won't show; start a live session if they should.", "before": {"run": "plain-tester__task1", "step": 15}, "overlays": [{"x": 350, "y": 496, "w": 545, "h": 36, "label": "Snapshot of now \u00b7 later edits won't show \u00b7 Share live instead \u25b8", "bg": "var(--panel)", "fg": "var(--ink)"}]}, {"id": "v4", "title": "Put the word 'Share' on the Share button", "for": ["plain-tester", "group-1", "group-2", "group-3"], "change": "Turn the top-right icon into a labelled button, as Figma, Miro and FigJam do.", "before": {"run": "plain-tester__task1", "step": 13}, "overlays": [{"x": 1150, "y": 16, "w": 90, "h": 40, "label": "Share"}]}, {"id": "v5", "title": "Make the flowchart shortcut impossible to miss", "for": ["group-1", "group-2"], "change": "Show the Ctrl + arrow tip as a chip next to the first box after it is drawn, instead of a faint grey line under the toolbar.", "before": {"run": "plain-tester__task1", "step": 3}, "overlays": [{"x": 420, "y": 66, "w": 440, "h": 34, "label": "Tip: select a box and press Ctrl + \u2192 to add the next step"}]}, {"id": "v6", "title": "Show what Excalidraw+ adds where people ask", "for": ["group-2"], "change": "Add a small footer to the link dialog: links that last, live team spaces, and the API, with a link to plans.", "before": {"run": "group-2__task1", "step": 15}, "overlays": [{"x": 350, "y": 496, "w": 545, "h": 36, "label": "Need links that last or the API? See Excalidraw+ plans \u25b8", "bg": "var(--panel)", "fg": "var(--accent)"}]}, {"id": "v7", "title": "Fold the style panel away while drawing", "for": ["group-3", "group-1"], "change": "Keep the style panel collapsed to a small tab until someone opens it, so the first box isn't drawn under it.", "before": {"run": "group-3__task1", "step": 3}, "overlays": [{"x": 14, "y": 84, "w": 150, "h": 40, "label": "Style \u25b8", "bg": "var(--panel)", "fg": "var(--ink)"}]}], "accuracy": "Each tester ran once per product (8 live browser runs on Camoufox). The groups describe who these Product Hunt users are. On 276 past launches their simulated reactions covered 65% of the broad points real commenters raised but only about 9% of the exact issues, and how they behave inside a product has not been validated. Treat each split as a hypothesis with a recording you can watch.", "runs": {"group-1__comp1": {"outcome": "blocked", "notes": "Drawing part was easy and fast: no signup wall, R/A shortcuts work like Excalidraw/Figma, Enter-to-label on a selected box, arrows bind edge-to-edge to shapes and labels reflow on resize. Friction while drawing: clicking the toolbar rectangle icon did not seem to activate it (had to use R), one rectangle drag became a tiny box with the label wrapped into a skinny column (had to resize), and one arrow drag shot its endpoint to the top-right corner under the Share/style panel, where the handle could not be grabbed, so I undid it. Sharing is where it broke: the small share icon next to \"Sign in to share\" is only Export (PNG of the current selection, which previewed only my selected arrow), with no anonymous link, unlike Excalidraw's no-account share link. \"Sign in to share\" asks only for an email (good), but a Cloudflare Turnstile check gates Continue, and after passing it the form returned \"Too many verification code requests. Please try again later.\" on the first real attempt. No code email arrived after two 45 s waits. A second attempt gave the same rate-limit error. I could not get a shareable link, so the outcome is blocked.", "steps": [{"step": 0, "action": {"type": "navigate", "url": "https://www.tldraw.com"}, "thought": ""}, {"step": 1, "action": {"type": "click", "x": 797, "y": 768}, "thought": "Straight into a blank canvas, no signup wall. Nice, that's the Excalidraw-style zero-friction start I like. Grabbing the rectangle tool for box one."}, {"step": 2, "action": {"type": "drag", "x": 150, "y": 300, "to_x": 310, "to_y": 400}, "thought": "The toolbar didn't visibly highlight the rectangle, but I'll just drag and see if a box appears.", "friction": "Toolbar rectangle did not activate"}, {"step": 3, "action": {"type": "key", "keys": "r"}, "thought": "Nothing drew and the select tool is still highlighted. Hmm. Figma and Excalidraw both use R for rectangle, let me try the keyboard shortcut."}, {"step": 4, "action": {"type": "drag", "x": 150, "y": 300, "to_x": 310, "to_y": 400}, "thought": "R worked, rectangle tool is now blue. Drawing box one."}, {"step": 5, "action": {"type": "key", "keys": "Enter"}, "thought": "Box drawn, tool snapped back to select. I'll hit Enter to label it, like editing a node in Excalidraw."}, {"step": 6, "action": {"type": "type", "text": "Sign up"}, "thought": "Handles disappeared so I think I'm in text-edit mode. Typing step 1."}, {"step": 7, "action": {"type": "key", "keys": "Escape"}, "thought": "Label landed, centered, hand-drawn font. Escape to exit editing."}, {"step": 8, "action": {"type": "key", "keys": "r"}, "thought": "Rectangle tool again for box two."}, {"step": 9, "action": {"type": "drag", "x": 450, "y": 300, "to_x": 610, "to_y": 400}, "thought": "Drawing box two to the right."}, {"step": 10, "action": {"type": "key", "keys": "Enter"}, "thought": "Enter to label box two."}, {"step": 11, "action": {"type": "type", "text": "Onboard"}, "thought": "Step 2 label."}, {"step": 12, "action": {"type": "key", "keys": "Escape"}, "thought": "Hm, my drag only made a tiny box and the text wrapped into a skinny column \"On/bo/ar/d\". The drag must have registered as a click. Escaping so I can widen it.", "friction": "Label wrapped into a skinny column"}, {"step": 13, "action": {"type": "drag", "x": 513, "y": 375, "to_x": 620, "to_y": 375}, "thought": "Dragging the right edge out to widen the Onboard box, like resizing a frame in Figma."}, {"step": 14, "action": {"type": "key", "keys": "r"}, "thought": "Resizing worked and the label reflowed nicely. Rectangle tool for box three."}, {"step": 15, "action": {"type": "drag", "x": 760, "y": 300, "to_x": 930, "to_y": 420}, "thought": "Drawing box three on the right."}, {"step": 16, "action": {"type": "key", "keys": "Enter"}, "thought": "Enter to label box three."}, {"step": 17, "action": {"type": "type", "text": "Activate"}, "thought": "Step 3 label."}, {"step": 18, "action": {"type": "key", "keys": "Escape"}, "thought": "Done labeling. Now arrows."}, {"step": 19, "action": {"type": "key", "keys": "a"}, "thought": "A should be the arrow tool, same as Excalidraw."}, {"step": 20, "action": {"type": "drag", "x": 260, "y": 350, "to_x": 520, "to_y": 375}, "thought": "Arrow tool active. Dragging from inside Sign up to inside Onboard, hoping it binds to both shapes like Excalidraw connectors."}, {"step": 21, "action": {"type": "drag", "x": 1127, "y": 26, "to_x": 520, "to_y": 380}, "thought": "Weird, the arrow shot off to the top-right corner instead of ending on Onboard. The start did bind to Sign up though. I'll grab the end handle and drop it on the Onboard box.", "friction": "Arrow end flew under the toolbar"}, {"step": 22, "action": {"type": "key", "keys": "Control+z"}, "thought": "The handle didn't move, it sits right under the style panel and Share icon so maybe the grab hit the UI. I'll just undo this stray arrow and redraw it."}, {"step": 23, "action": {"type": "key", "keys": "a"}, "thought": "Stray arrow gone. Arrow tool again."}, {"step": 24, "action": {"type": "drag", "x": 290, "y": 360, "to_x": 480, "to_y": 370}, "thought": "Shorter drag this time, from Sign up's right side into Onboard's left side."}, {"step": 25, "action": {"type": "key", "keys": "a"}, "thought": "Arrow 1 snapped edge-to-edge, bound to both boxes. That's better than Excalidraw's binding feel. Arrow tool again for 2."}, {"step": 26, "action": {"type": "drag", "x": 600, "y": 370, "to_x": 790, "to_y": 360}, "thought": "Onboard to Activate."}, {"step": 27, "action": {"type": "click", "x": 1131, "y": 25}, "thought": "Flowchart done: three boxes, two bound arrows, under 2 minutes. Now the link. The big blue button says \"Sign in to share\", which is a gate I'd rather avoid, so I'll try the little share icon next to it first and see if there's an anonymous snapshot link."}, {"step": 28, "action": {"type": "click", "x": 1213, "y": 24}, "thought": "The share icon is actually just Export, a PNG of whatever is selected (it's previewing only my arrow, 192x71). No link option anonymously. Excalidraw gives a shareable link without an account, so this is a step back. Fine, I'll see what \"Sign in to share\" asks for.", "friction": "Share icon only exports a PNG"}, {"step": 29, "action": {"type": "type", "text": "usersimsignu.ps+tldrawddee36@gmail.com", "x": 640, "y": 498, "submit": true}, "thought": "Only email, no password or company fields. That's a light ask, comparable to a Notion/Linear magic-code login. I'll go with it since my drawing stays put behind the modal."}, {"step": 30, "action": {"type": "solve_captcha"}, "thought": "I try to get past the captcha."}, {"step": 31, "action": {"type": "wait", "ms": 1500}, "thought": "A Cloudflare \"verify you are human\" box appeared and the Continue button is greyed out. Checking whether it submitted."}, {"step": 32, "action": {"type": "click", "x": 513, "y": 608}, "thought": "Continue is still disabled. Ticking the Cloudflare checkbox."}, {"step": 33, "action": {"type": "click", "x": 642, "y": 569}, "thought": "\"Too many verification code requests. Please try again later.\" on my very first attempt. No code arrived. I'll try Continue once more after waiting a bit.", "friction": "'Too many verification requests' on first try"}, {"step": 34, "action": {"type": "wait", "ms": 3000}, "thought": "Back to the greyed-out button with a human check pending again. Waiting for the checkbox to show."}, {"step": 35, "action": {"type": "click", "x": 513, "y": 608}, "thought": "One more tick of the checkbox. If it rate-limits me again, I'm done.", "friction": "Blocked: no code arrived"}], "sprite": "shots/group-1__comp1.jpg", "watch": "https://atelier-sim.com/?study=8de1b688-3a50-4bb4-8bab-5fcd2f0ac3cb"}, "group-1__task1": {"outcome": "completed", "notes": "Done in 16 actions, no signup. Easy: the canvas opens straight away. The hint text (\"Enter to add text, Ctrl+arrow to create a flowchart\") turned 3 boxes plus bound arrows into a few keystrokes, faster than Miro/Whimsical. Share icon top-right opens a clear choice: live E2E session or read-only 'Export to Link'. Link copied with a green check, and the E2E encryption note (key in URL fragment) is a strong privacy signal. Friction: share button is icon-only with no label. The style panel opens big and covers the canvas as soon as you draw. I had to infer that 'Export to Link' is a static snapshot, so later edits won't reach the teammate; no expiry/permissions info. The link is very long and ugly for Slack. Integration story (Notion/Slack/GitHub embeds) not visible from this flow.", "steps": [{"step": 0, "action": {"type": "open", "url": "https://excalidraw.com"}, "thought": ""}, {"step": 1, "action": {"type": "click", "x": 520, "y": 38}, "thought": "No signup wall, straight into a canvas, and it says drawings live in browser storage. That's the privacy-first, open-source vibe I like. Grabbing the rectangle tool, same as Figma/tldraw."}, {"step": 2, "action": {"type": "drag", "x": 300, "y": 320, "to_x": 460, "to_y": 400}, "thought": "Style panel popped up on the left, a lot of options but I just want a box. Dragging out the first step.", "friction": "Style panel covers the canvas"}, {"step": 3, "action": {"type": "key", "keys": "Enter"}, "thought": "Nice, there's a hint: Enter to add text, Ctrl+arrow to create a flowchart. That's a builder-friendly keyboard shortcut, like Linear's. Let me label this box first."}, {"step": 4, "action": {"type": "type", "text": "Sign up"}, "thought": "Text cursor is in the box. Typing step 1 of our onboarding flow."}, {"step": 5, "action": {"type": "key", "keys": "Escape"}, "thought": "Label is in. Esc to finish editing, then I'll try that Ctrl+arrow flowchart trick."}, {"step": 6, "action": {"type": "key", "keys": "Control+ArrowRight"}, "thought": "Box is selected. Trying Ctrl+Right to auto-spawn the next connected node, like Whimsical's quick-add."}, {"step": 7, "action": {"type": "key", "keys": "Enter"}, "thought": "That's slick: one shortcut gave me a new box plus a bound arrow, new box already selected. Way faster than drawing connectors in Miro. Enter to label it."}, {"step": 8, "action": {"type": "type", "text": "Connect repo"}, "thought": "Step 2 label."}, {"step": 9, "action": {"type": "key", "keys": "Escape"}, "thought": "Done editing, back to the selected box so I can chain the third node."}, {"step": 10, "action": {"type": "key", "keys": "Control+ArrowRight"}, "thought": "Same trick again for step 3."}, {"step": 11, "action": {"type": "key", "keys": "Enter"}, "thought": "Third box and arrow in place. Label it."}, {"step": 12, "action": {"type": "type", "text": "Deploy"}, "thought": "Step 3: Deploy."}, {"step": 13, "action": {"type": "key", "keys": "Escape"}, "thought": "Flowchart done in under a minute. Now the real question: how do I get a shareable link?"}, {"step": 14, "action": {"type": "click", "x": 1198, "y": 34}, "thought": "The purple icon top-right looks like the standard share glyph, same spot as Figma's Share button. No label though, I'm guessing.", "friction": "Share is an icon with no label"}, {"step": 15, "action": {"type": "click", "x": 640, "y": 589}, "thought": "Two choices: live E2E-encrypted session, or a read-only export link. For async 'send to a teammate', read-only link is right, like a Loom share link. Love that E2E encryption is the default story."}, {"step": 16, "action": {"type": "click", "x": 804, "y": 404}, "thought": "Got a link instantly, no account. The key lives in the URL fragment (#json=...,key) so the server never sees it, a smart and simple E2E design. Copying it. Only question: it's a static snapshot, so edits after this won't show up for my teammate.", "friction": "Link is a static snapshot; nothing says edits won't show"}], "sprite": "shots/group-1__task1.jpg", "watch": "https://atelier-sim.com/?study=8b74cc8c-5870-40a0-8e87-ca884812f759"}, "group-2__comp1": {"outcome": "completed", "notes": "Completed: drew 3 labelled boxes (Open PR -> CI checks -> Deploy) joined by 2 bound arrows, signed up by email, and copied the share link (https://www.tldraw.com/f/I4ThGaJE8qwzMyAlHpL3N, 'Anyone with the link: Editor'). Easy: no signup to start drawing; R/A shortcuts and Enter-to-label match Excalidraw/Figma; arrows bind to shapes automatically; anonymous drawing carried over into the account file after signup. Hard/friction: the share icon next to 'Sign in to share' only opens an Export-PNG panel (and previews just the selected arrow), so no link without an account, unlike Excalidraw's anonymous live link; Cloudflare Turnstile appeared after 'Continue with email' with the button greyed and no feedback; extra terms-accept modal after code entry; sharing defaults to ON with Editor rights for anyone with the link; 'Copy link' gave no visible confirmation in the screenshot; file auto-named by timestamp. As a dev/PM persona I never saw pricing, plan limits or integrations (GitHub, API) along the way - only a 'Build with the tldraw SDK' link, which is the clearest differentiator vs Excalidraw.", "steps": [{"step": 0, "action": {"type": "open", "url": "https://www.tldraw.com"}, "thought": ""}, {"step": 1, "action": {"type": "click", "x": 797, "y": 768}, "thought": "Straight into a canvas, no signup wall - nice, feels like Excalidraw. There's a 'Build with the tldraw SDK' badge, which is the dev angle I care about. First: rectangle tool from the toolbar."}, {"step": 2, "action": {"type": "drag", "x": 150, "y": 300, "to_x": 310, "to_y": 400}, "thought": "Rectangle tool is active. Dragging out box 1 on the left."}, {"step": 3, "action": {"type": "key", "keys": "Enter"}, "thought": "Box drawn, tool snapped back to select like Figma does. I'll hit Enter to edit the label, which is what I'd try in Figma/Excalidraw."}, {"step": 4, "action": {"type": "type", "text": "Open PR"}, "thought": "Typing step 1 of a dev workflow: Open PR."}, {"step": 5, "action": {"type": "key", "keys": "Escape"}, "thought": "Label works. <script>
(function(){

function renderTheatre(){
  const sec=el("section",{id:"watch"},
    el("header",{},el("div",{},el("div",{class:"eyebrow"},"Watch them"),el("h2",{},"Every click, with what they were thinking"),el("p",{},"Pick a tester and a product. Yellow ticks are where the group split from the plain tester; red ticks are friction. Use ← → or space."))),
    el("div",{class:"theatre"},
      el("div",{class:"stagebox"},

        el("div",{id:"screenwrap"}),
        el("div",{class:"bar"},el("button",{class:"play",id:"play","aria-label":"Play"},"▶"),el("div",{class:"ticks",id:"ticks"}),el("span",{class:"stepn",id:"stepn"}))),

function screenFor(runk,i,withRipple){

function drawTheatre(rip){
  const pick=$("#pick");pick.innerHTML="";
  const ts=el("div",{class:"seg"},D.testers.map(t=>el("button",{"aria-pressed":String(t.label===state.tester),onclick:()=>select(t.label,state.prod,0)},el("span",{class:"dot",style:`background:${colorOf(t.label)};display:inline-block;margin-right:6px`}),t.short||t.name)));

function renderPaths(){
  const sec=el("section",{id:"paths"},el("header",{},el("div",{},el("div",{class:"eyebrow"},"Paths"),el("h2",{},"Where each tester went, screen by screen"),el("p",{},"Each row is one run; each square is one step, coloured by the screen they were on. Click a square to watch that moment."))));

        const ti=document.createElementNS(ns,"title");ti.textContent=`${t.short||t.name}, step ${s.step} · ${st}\n${(s.thought||"").slice(0,120)}`;rc.append(ti);
        rc.addEventListener("click",()=>{state.compare=false;select(t.label,pr,i);$("#watch").scrollIntoView()});svg.append(rc)});
      const end=left+r.steps.length*cw+4;tx(end,y+17,r.outcome==="completed"?"✓":r.outcome==="gave_up"?"left":"blocked")});
    box.append(svg);
    box.append(el("div",{class:"legend"},stages.map((s,i)=>el("span",{},el("span",{class:"dot",style:`display:inline-block;background:var(--stage${i});margin-right:6px;vertical-align:middle`}),s)),el("span",{},"▢ outlined = a split moment")));

function focusBox(ovs){if(!ovs.length)return{x:0,y:0,w:1280,h:800};
  let x0=Math.min(...ovs.map(o=>o.x)),y0=Math.min(...ovs.map(o=>o.y)),x1=Math.max(...ovs.map(o=>o.x+o.w)),y1=Math.max(...ovs.map(o=>o.y+o.h));
  let w=Math.max(x1-x0+260,520),h=Math.max(y1-y0+180,w*0.5);if(h>800){h=800}if(w>1280)w=1280;

function drawDecision(vid){
  const box=document.querySelector(`.decide[data-v="${vid}"]`);if(!box)return;box.innerHTML="";
  const cur=state.decisions[vid]?.status||null;
  box.append(
    el("button",{class:"yes","aria-pressed":String(cur==="approved"),onclick:()=>decide(vid,cur==="approved"?null:"approved")},"Approve"),
    el("button",{class:"no","aria-pressed":String(cur==="rejected"),onclick:()=>decide(vid,cur==="rejected"?null:"rejected")},"Not now"),
    el("span",{class:"who-dec",id:`who-${vid}`},cur?(cur==="approved"?"Approved":"Set aside")+(state.decisions[vid]?.mine===false?" by a teammate":""):""));
}
async function decide(vid,status){
  state.decisions[vid]={status,mine:true};drawDecision(vid);drawShip();
  try{localStorage.setItem("usersim-dec",JSON.stringify(state.decisions))}catch(e){}
  if(dbRef){try{const me=userRef?await userRef.id():null;
      if(status) await dbRef.doc("decisions/"+vid).set({status,by:me,at:Date.now()}); else await dbRef.doc("decisions/"+vid).delete();
    }catch(e){const w=document.getElementById(`who-${vid}`);if(w)w.textContent="Saved on this device only"}}
}
function drawShip(){
  const s=$("#ship");if(!s)return;s.innerHTML="";
  const ap=(D.variations||[]).filter(v=>state.decisions[v.id]?.status==="approved");
  s.append(el("div",{class:"eyebrow"},"Ship list"),
    el("h3",{style:"margin-top:6px"},ap.length?`${ap.length} of ${(D.variations||[]).length} variations approved`:"Nothing approved yet"),
    ap.length?el("ol",{},ap.map(v=>el("li",{},el("strong",{},v.title),el("span",{class:"muted"},` · for ${(v.for||[]).map(l=>T(l)?.short||l).join(", ")}`)))):el("p",{class:"muted",style:"margin:6px 0 0"},"Approve variations above. In Claude Code, the plugin applies approved ones on a new branch and re-runs only the testers they affect."));
}

function renderTrust(){
  $("#app").append(el("p",{class:"trust"},el("strong",{},"How far to trust this. "),D.accuracy," Runs are single sessions per tester; read counts as runs, not rates."));
}

async function wireDb(){
  try{const saved=JSON.parse(localStorage.getItem("usersim-dec")||"{}");Object.assign(state.decisions,saved)}catch(e){}
  (D.variations||[]).forEach(v=>drawDecision(v.id));drawShip();
  if(!window.claude||!window.claude.use) return;
  try{dbRef=await window.claude.use("db");userRef=await window.claude.use("user")}catch(e){dbRef=null}
  if(!dbRef) return;
  const me=userRef?await userRef.id().catch(()=>null):null;
  dbRef.collection("decisions").onSnapshot(snap=>{
    const next={};snap.docs.forEach(d=>{const x=d.data();next[d.id]={status:x.status,mine:me?x.by===me:true}});
    state.decisions=next;(D.variations||[]).forEach(v=>drawDecision(v.id));drawShip();
  },()=>{});
}

(async()=>{
  await load();
  if(!D){$("#top").innerHTML="";$("#top").append(el("p",{},"The session data did not load. Re-open the page, or re-run the plugin's replay step."));return}
