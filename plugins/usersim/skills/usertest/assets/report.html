/* Layout: decision first. Verdict + disclosure, then the ranked ship list (the deliverable), then the race (evidence at a glance),

:root{

  --t0:#59606e; --t1:#d4572a; --t2:#2d8f8a; --t3:#8a4fd1;
  --display:"Bricolage Grotesque",ui-sans-serif,system-ui,sans-serif;
  --body:"Geist",ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:"Geist Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
  --r:10px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0f1115; --panel:#171a20; --ink:#e9ebf0; --muted:#9aa2b1; --line:#2a2f39; --sunk:#1d2129;
  --accent:#7c93ff; --accent-ink:#0f1115; --hi:#5a4a10; --hi-ink:#ffe9a6;
  --ok:#4cc38a; --warn:#e7a43b; --bad:#ef7b7b; --okbg:#173326; --badbg:#3a1d1f; --warnbg:#3a2c14;
  --t0:#a3abb9; --t1:#ff8a5c; --t2:#4fc9c2; --t3:#b48cff; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0f1115; --panel:#171a20; --ink:#e9ebf0; --muted:#9aa2b1; --line:#2a2f39; --sunk:#1d2129;
  --accent:#7c93ff; --accent-ink:#0f1115; --hi:#5a4a10; --hi-ink:#ffe9a6;
  --ok:#4cc38a; --warn:#e7a43b; --bad:#ef7b7b; --okbg:#173326; --badbg:#3a1d1f; --warnbg:#3a2c14;
  --t0:#a3abb9; --t1:#ff8a5c; --t2:#4fc9c2; --t3:#b48cff; color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
html{scroll-behavior:smooth}
body{background:var(--bg);color:var(--ink);font:15px/1.55 var(--body);margin:0;overflow-x:hidden}
.wrap{max-width:1180px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:28px 120px;display:grid;grid-template-columns:minmax(0,1fr);gap:48px}
.wrap>*{min-width:0}

button{font:inherit;color:inherit;cursor:pointer}
a{color:var(--accent)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

.race{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:16px;display:grid;gap:14px}

.bars{display:grid;gap:5px;min-width:0}
.bar{display:grid;grid-template-columns:78px minmax(0,1fr) 132px;}

.track{display:flex;gap:1px;height:16px;min-width:0}

.filters{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}

  try{const s=JSON.parse(localStorage.getItem("usersim-dec2")||"{}");Object.assign(state.decisions,s.d||{});Object.assign(state.notes,s.n||{})}catch(e){}
  D.variations.forEach(v=>drawAct(v.id));drawShipbar();
  if(!window.claude||!window.claude.use)return;
  try{dbRef=await window.claude.use("db");userRef=await window.claude.use("user")}catch(e){dbRef=null}
  if(!dbRef)return;try{meId=userRef?await userRef.id():null}catch(e){}
  dbRef.collection("decisions").onSnapshot(snap=>{const d={},n={};snap.docs.forEach(x=>{const v=x.data();if(v.status)d[x.id]=v.status;if(v.note)n[x.id]=v.note});
    state.decisions=d;state.notes=n;D.variations.forEach(v=>drawAct(v.id));drawShipbar()},()=>{});
}
function navSpy(){const links=[...document.querySelectorAll("#minnav a")];const io=new IntersectionObserver(es=>{es.forEach(e=>{if(e.isIntersecting){links.forEach(l=>l.classList.toggle("on",l.getAttribute("href")==="#"+e.target.id))}})},{rootMargin:"-40% 0px -55% 0px"});["race","decide","watch","voices","method"].forEach(id=>{const e=document.getElementById(id);if(e)io.observe(e)})}
(async()=>{await load();
  if(!D){$("#hero").innerHTML="";$("#hero").append(el("p",{},"The session data did not load. Re-run the plugin's replay step."));return}
  renderHero();renderRace();renderDecide();renderTheatre();
  state.tester=D.testers[0].label;state.prod=PK()[0];state.step=1;drawTheatre(false);
  renderVoices();renderMethod();wireDb();navSpy();
})();
})();
</script>
