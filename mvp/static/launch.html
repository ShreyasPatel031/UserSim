<style>
:root{--paper:#FBF4E4;--ink:#0a0808;--soft:color-mix(in srgb,var(--ink) 62%,var(--paper));--rule:color-mix(in srgb,var(--ink) 18%,var(--paper));
 --tint:color-mix(in srgb,var(--ink) 5%,var(--paper));--ok:#2d6a43;--neg:#a3341c;--warnbg:color-mix(in srgb,#c98a00 12%,var(--paper));
 --serif:"Baskervville",Georgia,serif;--sans:Avenir,"Avenir Next","Nunito Sans",ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;
 --s1:4px;--s2:8px;--s3:12px;--s4:16px;--s5:24px;--s6:32px;--gut:clamp(16px,2.2vw,32px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--paper:#14120f;--ink:#f3ecdc;--ok:#7cc79a;--neg:#f08a6c}}
:root[data-theme="dark"]{--paper:#14120f;--ink:#f3ecdc;--ok:#7cc79a;--neg:#f08a6c}
*{box-sizing:border-box;border-radius:0}
html,body{margin:0}
body{background:var(--paper);color:var(--ink);font:400 14px/1.5 var(--sans);-webkit-font-smoothing:antialiased}
.app{height:100vh;display:flex;flex-direction:column;padding:var(--s4) var(--gut);gap:var(--s4);max-width:1520px;margin:0 auto}
.top{display:flex;align-items:center;gap:var(--s4);flex-wrap:wrap;padding-bottom:var(--s4);border-bottom:1px solid var(--rule)}
.mark{font:400 21px/1 var(--serif)}
.tabs{display:flex}
.tab{border:1px solid var(--rule);background:transparent;color:var(--ink);height:36px;padding:0 var(--s3);font:400 12px var(--sans);cursor:pointer}
.tab+.tab{border-left:0}.tab.on{background:var(--ink);color:var(--paper);border-color:var(--ink)}
form{display:flex;flex:1;min-width:240px;max-width:560px;height:36px;border:1px solid var(--ink)}
form input{flex:1;min-width:0;border:0;background:transparent;color:var(--ink);font:400 14px var(--sans);padding:0 var(--s3)}
form button{border:0;background:var(--ink);color:var(--paper);font:600 13px var(--sans);padding:0 var(--s4);cursor:pointer}
form button:disabled{opacity:.5}
.status{color:var(--soft);font-size:12px}
.banner{background:var(--warnbg);border:1px solid var(--rule);padding:var(--s2) var(--s3);font-size:13px}
.banner code{word-break:break-all}
.head{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.9fr);gap:var(--s5);align-items:start;padding-bottom:var(--s4);border-bottom:1px solid var(--rule)}
.head h1{font:400 clamp(26px,2.4vw,36px)/1.05 var(--serif);margin:0}
.head .tag{color:var(--soft);margin-top:var(--s2)}
.stats{display:grid;grid-template-columns:2fr 1fr 1fr}
.stats>div{padding:0 var(--s4);border-left:1px solid var(--rule)}
.label{display:block;font:400 10.5px/1.4 var(--sans);letter-spacing:.1em;text-transform:uppercase;color:var(--soft)}
.stats b{display:block;font-weight:400;font-size:13px;line-height:1.4;margin-top:var(--s1)}
.stats .big{font:300 22px/1.15 var(--sans)}
.grid{flex:1;min-height:0;display:grid;grid-template-columns:1.1fr 1fr 1fr}
.col{min-height:0;overflow:auto;padding:0 var(--s5);border-left:1px solid var(--rule)}
.col:first-child{padding-left:0;border-left:0}.col:last-child{padding-right:0}
h2{font:400 22px/1.15 var(--serif);margin:0 0 var(--s2)}
h3{font:400 18px/1.2 var(--serif);margin:var(--s5) 0 var(--s2)}
.sub{margin-bottom:var(--s3)}
.persona{display:grid;grid-template-columns:64px minmax(0,1fr);gap:var(--s3);padding:var(--s3) 0;border-top:1px solid var(--rule)}
.av{width:64px;height:72px;display:flex;align-items:center;justify-content:center}
.av img{height:64px;image-rendering:pixelated}
.pname{font:400 16px/1.25 var(--serif)}
.pstat{font-size:12px;color:var(--soft);margin-top:2px}.pstat .lk{color:var(--ink);font-weight:700}
.bar{height:4px;background:var(--tint);margin:var(--s2) 0}.bar span{display:block;height:100%}
.chips{display:flex;flex-wrap:wrap;gap:var(--s1)}.chips span{border:1px solid var(--rule);padding:1px 6px;font-size:11.5px}
details.say{margin-top:var(--s2)}
details.say summary{cursor:pointer;font:400 10.5px/1.4 var(--sans);letter-spacing:.1em;text-transform:uppercase;color:var(--soft)}
.q{background:var(--tint);padding:var(--s2) var(--s3);margin-top:var(--s2);font-size:13px}
.q .meta{font-size:11px;color:var(--soft);margin-bottom:2px}.q .meta b{font-weight:600}
.s-positive{color:var(--ok)}.s-skeptical,.s-negative{color:var(--neg)}.s-mixed{color:#8a5a00}
.comp{padding:var(--s3);border:1px solid var(--rule);margin-bottom:var(--s3)}
.chead{display:flex;gap:var(--s2);align-items:center}
.logo{width:24px;height:24px;flex:none;object-fit:contain;background:#fff;border:1px solid var(--rule)}
.logo.mono{display:inline-flex;align-items:center;justify-content:center;color:#fff;font-weight:700;font-size:11px;border:0}
.cname{font:400 16px/1.2 var(--serif)}.cwhat{font-size:12px;color:var(--soft);margin-top:var(--s1)}
.pick{display:grid;grid-template-columns:1fr 1fr;gap:var(--s3);margin-top:var(--s3);font-size:13px}
.pick .label.good{color:var(--ok)}.pick .label.bad{color:var(--neg)}
.legend{display:flex;gap:var(--s3);margin-bottom:var(--s2)}.legend i{display:inline-block;width:9px;height:9px;margin-right:var(--s1);vertical-align:-1px;opacity:.4}
details.fx{border-top:1px solid var(--rule)}
details.fx summary{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(60px,1fr) 48px;gap:var(--s2);align-items:center;padding:var(--s2) 0;cursor:pointer;list-style:none;font-size:13px}
details.fx summary::-webkit-details-marker{display:none}
details.fx p{margin:0 0 var(--s2);font-size:12.5px;color:var(--soft)}
.fl{display:flex;align-items:center;gap:var(--s2);min-width:0}
.fi{flex:none;color:var(--soft)}
.info{position:relative;flex:none;width:14px;height:14px;border:1px solid var(--rule);border-radius:50%!important;font:600 9px/12px var(--sans);text-align:center;color:var(--soft);cursor:help}
.info:hover,.info:focus{color:var(--ink);border-color:var(--soft);outline:none}
.info:hover::after,.info:focus::after{content:attr(data-tip);position:absolute;left:-8px;top:20px;z-index:5;width:250px;padding:var(--s2) var(--s3);background:var(--ink);color:var(--paper);font:400 12px/1.45 var(--sans);text-align:left;pointer-events:none}
.dt{position:relative;height:8px;background:var(--tint)}
.dt::after{content:"";position:absolute;left:50%;top:-3px;bottom:-3px;width:1px;background:var(--soft)}
.dt i{position:absolute;top:0;height:8px}.dt i.pos{background:color-mix(in srgb,var(--ok) 40%,transparent)}.dt i.neg{background:color-mix(in srgb,var(--neg) 40%,transparent)}
.dt i.unk{left:38%;width:24%;top:0;height:8px;box-sizing:border-box;border:1px dashed var(--soft);background:transparent}
.bv{font-size:11.5px;text-align:right;font-weight:600}.bv.pos{color:var(--ok)}.bv.neg{color:var(--neg)}.bv.qv{color:var(--soft)}
ol.next{margin:0;padding-left:20px}ol.next li{padding:var(--s1) 0;font-size:13px}ol.next li b{font-weight:600}
.wait{color:var(--soft);font-size:12.5px;padding:var(--s2) 0}
.sk{display:block;height:10px;background:linear-gradient(90deg,var(--tint),color-mix(in srgb,var(--ink) 10%,var(--paper)),var(--tint));background-size:200% 100%;animation:sh 1.2s linear infinite;margin:var(--s2) 0}
@keyframes sh{to{background-position:-200% 0}}
@media (prefers-reduced-motion:reduce){.sk{animation:none}}
.fade{animation:fd .35s ease}@keyframes fd{from{opacity:0}to{opacity:1}}
.foot{font-size:11px;color:var(--soft);border-top:1px solid var(--rule);padding-top:var(--s2)}
.md{overflow:auto}
@media (max-width:980px){.app{height:auto}.grid{grid-template-columns:1fr}.col{border-left:0;padding:var(--s4) 0;border-top:1px solid var(--rule);overflow:visible}.head{grid-template-columns:1fr}.stats{grid-template-columns:1fr}.stats>div{border-left:0;padding:var(--s1) 0}}
.hzs{display:grid;gap:var(--s2)}
.hz{border:1px solid var(--rule);padding:var(--s2) var(--s3)}
.hzh{display:flex;justify-content:space-between;align-items:baseline;gap:var(--s2);margin-bottom:var(--s1)}
.hzh b{font:400 15px/1.2 var(--serif)}
.hz p{margin:0;font-size:13px}
.clamp{display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
</style>
<div class="app">

  <div class="md" id="md" hidden></div>

y the AI agent concept for coding but cautious about real-world complexity."}, {"type": "Type B", "comment": "The idea of AI agents understanding customer needs from various sources (Gmail, Slack, Jira) and then building code is powerful. I'm curious about the 'Playbooks' feature \u2013 how granular can these be, and can we easily share/adapt them across different customer types?", "sentiment": "positive", "why": "Sees potential for significant efficiency gains in deployment workflows."}, {"type": "Type C", "comment": "As a founder, anything that speeds up customer onboarding and reduces engineering overhead is gold. The 'live model of each customer' is a great hook. What's the typical ramp-up time for a new team to get these agents effectively integrated and productive?", "sentiment": "positive", "why": "Directly addresses a common pain point for scaling teams."}, {"type": "Type D", "comment": "This sounds like it could really help our small team get customers live faster. I like that it integrates with GitHub. Is there a way to easily override or guide the Build Agent if it's going in the wrong direction, or is it more of a 'set it and forget it' system?", "sentiment": "mixed", "why": "Interested in automation but concerned about losing control over the coding process."}, {"type": "Type E", "comment": "Another AI agent product aiming to automate coding. The customer intelligence angle is a good differentiator. How does this compare to other 'AI dev' tools we've seen recently in terms of auditability and ensuring the AI-generated code meets specific enterprise security standards?", "sentiment": "skeptical", "why": "Seen many similar products; looking for clear differentiators and practical answers to common concerns."}, {"type": "Type F", "comment": "Interesting concept for deployment teams. It's always a challenge to keep everyone aligned on customer needs. While not directly in my domain, I can see how this could be a huge time-saver for engineering-heavy compani if(HTTP){const t=document.querySelector('.tab[data-mode="card"]'); if(t) t.remove();}
const $=id=>document.getElementById(id);
const esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const fmt=n=>Number(n||0).toLocaleString("en-US");
const addHelp=`To run it, add the UserSim server as a connector once: claude.ai → Settings → Connectors → <b>Add custom connector</b>, name <b>UserSim</b>, URL <code>${MCP_URL}</code> with your token. Then reload.`;
function setupMsg(h){const s=$("setup");s.innerHTML=h;s.hidden=false;}
document.querySelectorAll(".tab").forEach(b=>b.onclick=()=>{document.querySelectorAll(".tab").forEach(x=>x.classList.toggle("on",x===b));mode=b.dataset.mode;
  $("url").placeholder=mode==="quick"?"https://yourproduct.com":"Product name or link on today's Product Hunt";});
const mcpReady=(async()=>{try{return await window.claude?.use("mcp");}catch{return null;}})();
(async()=>{mcp=await mcpReady;})();

function inline(s){return esc(s).replace(/\*\*(.+?)\*\*/g,"<b>$1</b>")}
function md(src){const o=[];let l=null;const c=()=>{if(l){o.push(`</${l}>`);l=null}};
  for(const line of String(src||"").split("\n")){let m;
    if((m=line.match(/^(#{1,3})\s+(.*)/))){c();o.push(`<h2>${inline(m[2])}</h2>`)}
    else if((m=line.match(/^\s*[-*]\s+(.*)/))){if(l!=="ul"){c();o.push("<ul>");l="ul"}o.push(`<li>${inline(m[1])}</li>`)}
    else if((m=line.match(/^\s*\d+\.\s+(.*)/))){if(l!=="ol"){c();o.push("<ol>");l="ol"}o.push(`<li>${inline(m[1])}</li>`)}
    else if(!line.trim())c(); else {c();o.push(`<p>${inline(line)}</p>`)}}
  c();return o.join("")}
const SENT={positive:"likes it",mixed:"mixed",skeptical:"skeptical",negative:"negative"};


const SK='<span class="sk" style="width:80%"></span><span class="sk" style="width:60%"></span><span class="sk" style="width:70%"></span>';
let P={}, RUN=0;
function who(){
  const w=P.people;
  if(!w) return `<h2>Who votes</h2><div class="wait">${P.analysis?"Matching it against 13,581 Product Hunt members…":"Reading the page…"}</div>${SK}`;
  if(w.error) return `<h2>Who votes</h2><div class="wait">${esc(w.error)}</div>`;
  const segs=(w.segments||[]).filter(s=>s.likely>0).sort((a,b)=>b.likely-a.likely).slice(0,3);
  const R=P.reactions||{}, reacts=R.reactions||[], tmap={};
  (R.types||[]).forEach(t=>{const s=String(t),i=s.indexOf(":");tmap[s.slice(0,i).trim()]=s.slice(i+1).trim();});
  const bk=segs.map(()=>[]); reacts.forEach((r,i)=>bk[i%Math.max(1,segs.length)]?.push(r));
  let h=`<h2>Who votes</h2><span class="label sub">${fmt(w.likely_count)} of ${fmt(w.people_scored)} members likely to vote</span>`;
  segs.forEach((s,i)=>{const k=i%AVATARS.length;
    h+=`<div class="persona"><div class="av" style="background:${AVC[k][1]}"><img alt="" src="${AVATARS[k]}"></div><div>
      <div class="pname">${esc(s.name)}</div>
      <div class="pstat">${fmt(s.likely)} of ${fmt(s.size)} · <b class="lk">${s.lift.toFixed(1)}× likelihood</b></div>
      <div class="bar"><span style="width:${Math.min(100,Math.round((s.share||0)*250))}%;background:${AVC[k][0]}"></span></div>
      <div class="chips">${(s.top_topics||[]).slice(0,3).map(t=>`<span>${esc(t)}</span>`).join("")}</div>
      ${bk[i]?.length?`<details class="say"><summary>What they'll say (${bk[i].length})</summary>${bk[i].map(r=>`<div class="q"><div class="meta">${esc(tmap[r.type]||"")} · <b class="s-${esc(r.sentiment)}">${esc(SENT[r.sentiment]||r.sentiment||"")}</b></div>${esc(r.comment)}</div>`).join("")}</details>`
        :(P.reactions?"":`<div class="wait">Simulating what they'll say…</div>`)}
    </div></div>`;});
  return h;
}
function compSec(){
  const c=P.competitors;
  if(c===undefined) return `<h2>Competitors</h2><div class="wait" id="cst">Finding competitors…</div>${SK}`;
  if(c&&c.error) return `<h2>Competitors</h2><div class="wait">Couldn't find competitors right now: ${esc(String(c.error).slice(0,140))}</div>`;
  return `<h2>Competitors</h2>`+compHtml(c);
}
function factors(){
  const a=P.analysis||{},w=P.people||{},R=P.reactions||{},Q=P.asks||{};const F=[];
  const top=(w.segments||[]).slice().sort((x,y)=>y.likely-x.likely)[0];
  if(top) F.push({n:"Audience fit",d:top.lift>=1?"up":"dn",s:top.lift>=2?2:1,w:`The groups most like it (${top.name}) are ${top.lift>=2?"far more":top.lift>=1?"somewhat more":"less"} drawn to it than to a typical launch.`,x:`Lead the tagline and first image with ${(top.top_topics||[]).slice(0,2).join(" and ")}.`});
  if(w.tiers){const heavy=w.tiers.filter(t=>/heavy/.test(t.tier)).reduce((s,t)=>s+(t.share||0),0);
    F.push({n:"Heavy voters in its audience",d:heavy>=.6?"up":"dn",s:heavy>=.8?2:1,w:heavy>=.6?"Most people it resembles upvote a lot, so the votes it wins come early.":"Few people it resembles are heavy voters.",x:heavy>=.6?"Launch at 00:01 PT and reply fast in the first hour.":"Bring your own supporters on launch day."});}
  const worry=(Q.concerns||[])[0]; if(worry) F.push({n:"Unanswered top worry",d:"dn",s:2,w:`“${worry}”`,x:"Answer the top worry in the first comment, and put the short answer on the page."});
  const rs=R.reactions||[], n=rs.length||1, sk=rs.filter(r=>/skeptic|negative/.test(r.sentiment||"")).length, mx=rs.filter(r=>r.sentiment==="mixed").length;
  if(sk) F.push({n:"Crowded category",d:"dn",s:sk/n>=.3?2:1,w:"Some visitors see many launches like this each week.",x:`Say the difference in one line: ${(a.strengths||[])[0]||"what only you do"}`});
  if(mx) F.push({n:"Doubts about it in practice",d:"dn",s:mx/n>=.4?2:1,w:(a.doubts||[])[0]||"They want to see it work on a real case.",x:"Show a short demo of a real, messy case."});
  if(a.clarity!=null) F.push({n:"How clear the page is",d:a.clarity>=4?"up":"dn",s:(a.clarity>=4||a.clarity<=2)?2:1,w:a.clarity>=4?"Visitors can tell quickly what it does.":"Visitors may not quickly get what it does.",x:a.clarity>=4?"Keep the tagline close to the page's own words.":"Rewrite the tagline as: who it's for + the one job."});
  if(a.pricing) F.push({n:"Price to try",d:/free/i.test(a.pricing)?"up":"dn",s:1,w:/free/i.test(a.pricing)?"A free way in lowers the bar to try it.":"Visitors can't try it without paying.",x:/free/i.test(a.pricing)?"Link the free tier in the first comment.":"Offer a launch-day trial."});
  if(P.analysis) F.push({n:"Your team's network",d:"q",s:1,w:"Usually the biggest factor, but hidden until the product is on Product Hunt's line-up.",x:"Tell your followers the launch date and get the makers' profiles active."});
  return F.sort((x,y)=>(x.d==="q")-(y.d==="q")||y.s-x.s||(x.d==="dn")-(y.d==="dn"));
}
function whySec(){
  const F=factors();
  if(!F.length) return `<h2>Why</h2><div class="wait">Reading the page…</div>${SK}`;
  const pending=!(P.people&&P.reactions&&P.asks);
  const row=f=>`<details class="fx"><summary><span class="fl">${FICON[f.n]||""}<span>${esc(f.n)}</span><span class="info" tabindex="0" role="note" aria-label="${esc(FDEF[f.n]||"")}" data-tip="${esc(FDEF[f.n]||"")}" onclick="event.preventDefault();event.stopPropagation()">i</span></span><span class="dt">${f.d==="q"?`<i class="unk"></i>`:`<i class="${f.d==="up"?"pos":"neg"}" style="width:${f.s===2?44:22}%;${f.d==="up"?"left:50%":"right:50%"}"></i>`}</span><span class="bv ${f.d==="up"?"pos":f.d==="dn"?"neg":"qv"}">${f.d==="q"?"?":f.s===2?"strong":"some"}</span></summary><p>${esc(f.w)}</p></details>`;
  const H={"Unanswered top worry":["s","Put the answer to the top worry on the page."],"Crowded category":["s",null],"How clear the page is":["s",null],
    "Audience fit":["m",null],"Doubts about it in practice":["m","Record a short demo of a real, messy case."],
    "Your team's network":["l",null],"Heavy voters in its audience":["l",null],"Price to try":["l",null]};
  const pri=f=>(f.d==="dn"?0:f.d==="q"?1:2)*10-f.s;
  const B={s:[],m:[],l:[]}; F.slice().sort((a,b)=>pri(a)-pri(b)).forEach(f=>{const h=H[f.n]||["m",null];B[h[0]].push(h[1]||f.x);});
  if(F.some(f=>f.n==="Unanswered top worry")) B.l.unshift("Answer the top worry in your first comment on launch day.");
  const box=(k,t,w)=>`<div class="hz"><div class="hzh"><span class="label">${t}</span><b>${w}</b></div><p>${esc(B[k][0]||"Nothing here yet.")}</p></div>`;
  return `<h2>Why</h2><div class="legend label"><span><i style="background:var(--ok)"></i>helps</span><span><i style="background:var(--neg)"></i>holds it back</span><span>? unknown</span></div>`+
    F.map(row).join("")+(pending?`<div class="wait">More factors arriving…</div>`:"")+
    `<h3 style="margin-top:var(--s4)">What to do next</h3><div class="hzs">${box("s","Short term","This week")}${box("m","Medium term","Weeks 2–3")}${box("l","Long term","Week 4 to launch day")}</div>`;
}
function head(){
  const a=P.analysis, L=P.launch, Q=P.asks;
  $("pname").textContent=a?.name||P.host||""; $("ptag").textContent=a?.tagline||(a?"":"Reading the page…");
  const rb=L?.rank_band?.likely, pct=L?.percentile;
  $("stats").innerHTML=`<div><span class="label">Top worry</span>${Q?`<b class="clamp" title="${esc((Q.concerns||[])[0]||Q.question||"")}">${esc((Q.concerns||[])[0]||Q.question||"—")}</b>`:SK}</div>
    <div><span class="label">Likely rank</span>${L?`<b class="big">${rb?esc(rb[0]+"–"+rb[1]):"—"}</b>`:SK}</div>
    <div><span class="label">Percentile</span>${L?`<b class="big">${pct!=null?esc(pct)+"th":"—"}</b>`:SK}</div>`;
}
function paint(){ $("res").hidden=false;$("grid").hidden=false;$("md").hidden=true; head(); $("who").innerHTML=who(); $("comp").innerHTML=compSec(); $("why").innerHTML=whySec(); }
function render(p){ // a whole saved run (or the launch card)
  if(!(p&&p.who_it_resembles)){ $("grid").hidden=true;$("res").hidden=true;const m=$("md");m.innerHTML=md(p?.card_markdown||String(p||""));m.hidden=false;return; }
  P={analysis:p.analysis,people:p.who_it_resembles,launch:p.where_it_may_land,reactions:p.simulated_reactions,asks:p.likely_questions,competitors:p.competitors};
  paint();
}
async function call(tool,input){
  if(HTTP){ const map={usersim_ph_quick_start:["/api/launch/start",{url:input.product_url}],usersim_ph_quick_step:["/api/launch/step",input],usersim_competitors:["/api/launch/competitors",{url:input.product_url}]};
    const m=map[tool]; if(!m) return {error:"not available on this page"};
    const r=await fetch(m[0],{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(m[1])});
    try{ return await r.json(); }catch{ return {error:`HTTP ${r.status}`}; } }
  const go=()=>mcp.callTool(SERVER,tool,input,{cache:false});
  let r; try{r=await go();}catch(e){ if(!e?.retryable||e.code==="tool_error") throw e; await new Promise(z=>setTimeout(z,Math.min(e.retryAfterMs||2000,15000)+Math.random()*800)); r=await go(); }
  let p=r.payload; if(typeof p==="string"){try{p=JSON.parse(p)}catch{}}
  return p;
}
const SV=d=>`<svg class="fi" viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${d}</svg>`;
const FICON={
 "Audience fit":SV('<circle cx="12" cy="12" r="8"/><circle cx="12" cy="12" r="4"/><circle cx="12" cy="12" r="0.8" fill="currentColor"/>'),
 "Heavy voters in its audience":SV('<path d="M12 4l7 9h-4v7H9v-7H5z"/>'),
 "Unanswered top worry":SV('<path d="M12 4l9 16H3z"/><path d="M12 10v4"/><circle cx="12" cy="17" r="0.6" fill="currentColor"/>'),
 "How clear the page is":SV('<path d="M2 12s4-7 10-7 10 7 10 7-4 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/>'),
 "Crowded category":SV('<rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/>'),
 "Doubts about it in practice":SV('<path d="M4 5h16v11H9l-5 4z"/><path d="M10 9a2 2 0 1 1 2 2v1"/>'),
 "Price to try":SV('<path d="M3 12V4h8l10 10-8 8z"/><circle cx="7.5" cy="8.5" r="1.2"/>'),
 "Your team's network":SV('<circle cx="6" cy="12" r="2.5"/><circle cx="18" cy="6" r="2.5"/><circle cx="18" cy="18" r="2.5"/><path d="M8.3 11l7.4-3.8M8.3 13l7.4 3.8"/>')};
const FDEF={
 "Audience fit":"How much more the Product Hunt groups most like this product are drawn to it than to a typical launch.",
 "Heavy voters in its audience":"The share of the people it resembles who upvote a lot (100+ actions). Heavy voters cast most of a launch day's votes.",
 "Unanswered top worry":"The question simulated visitors raise most often. Left unanswered, it shapes the comment thread and holds back undecided voters.",
 "How clear the page is":"How quickly a visitor can tell what the product does and who it's for, rated from the product's own page.",
 "Crowded category":"Whether simulated visitors say they've seen many launches like this one, so they ask what makes it different.",
 "Doubts about it in practice":"Whether interested visitors still hesitate about how it works on real, messy cases.",
 "Price to try":"Whether visitors can try it for free on launch day. A free way in lowers the bar to try and to vote.",
 "Your team's network":"How many people already follow the makers and hunter. Usually the biggest factor, but only visible once the product is on Product Hunt's line-up."};
function mono(n){n=String(n||"?");let x=0;for(const c of n)x=(x*31+c.charCodeAt(0))%360;
  return `<span class="logo mono" style="background:hsl(${x},50%,42%)">${esc(n.replace(/\(.*?\)/g,"").trim().split(/\s+/).map(w=>w[0]).join("").slice(0,2).toUpperCase())}</span>`}
function compHtml(c){
  if(!c?.length) return `<p class="cwhat">No live competitors were found.</p>`;
  return c.map(x=>`<div class="comp"><div class="chead">${x.logo?`<img class="logo" alt="" src="${x.logo}">`:mono(x.name)}<div class="cname">${esc(x.name)}</div></div><div class="cwhat">${esc(x.what||x.why_compared||"")}</div>
    <div class="pick"><div><div class="label good">Pick yours</div>${esc((x.prefer_yours||[])[0]||"—")}</div><div><div class="label bad">Pick ${esc(x.name)}</div>${esc((x.prefer_theirs||[])[0]||"—")}</div></div></div>`).join("");
}
function showError(e){
  const c=e?.code, M={server_not_connected:addHelp,needs_reauth:"Reconnect UserSim in claude.ai Settings → Connectors.",not_in_manifest:"Allow this page to use UserSim from its Permissions menu.",
    approval_required:"Click Simulate again and allow it.",server_unavailable:"The UserSim server didn't answer. Try again in a minute.",not_granted:"Open this page in claude.ai to run it."};
  if(c==="tool_error"){$("status").textContent="The server said: "+(e.message||"error");return;}
  $("status").textContent="";
  if(c==="upstream_error"&&/access isn't confirmed/.test(e?.message||"")){setupMsg("claude.ai hasn't confirmed this page may use the <b>UserSim</b> connector. Allow it, check the connector exists in Settings → Connectors, then try again.");return;}
  setupMsg(M[c]||("Something failed ("+esc(c||"error")+"): "+esc(e?.message||"")));
}

function fail(msg){ RUN++; $("status").textContent=""; setupMsg(esc(msg)); P={host:P.host,failed:msg}; $("pname").textContent=P.host||""; $("ptag").textContent="";
  $("stats").innerHTML=""; ["who","comp","why"].forEach(id=>$(id).innerHTML=`<h2>${{who:"Who votes",comp:"Competitors",why:"Why"}[id]}</h2><div class="wait">Stopped: ${esc(msg)}</div>`); }
async function runQuick(url){
  const me=++RUN, t0=Date.now(), mark=k=>{window.__marks&&window.__marks.push([k,Date.now()-t0]);};
  let host=""; try{host=new URL(url).hostname.replace(/^www\./,"");}catch{}
  P={host}; paint(); mark("skeleton");
  const live=()=>me===RUN;
  const tk=setInterval(()=>{ if(!live())return; const done=["analysis","people","launch","reactions","asks"].filter(k=>P[k]).length;
    $("status").textContent=`Simulating… ${Math.round((Date.now()-t0)/1000)} s · ${done}/5 parts`; const c=$("cst"); if(c) c.textContent=`Finding competitors… ${Math.round((Date.now()-t0)/1000)} s`; },500);
  const dog=setTimeout(()=>{ if(!HTTP&&live()&&!P.analysis) setupMsg("The server normally answers in 3–5 s and hasn't answered through claude.ai yet. "+"Still waiting for the UserSim connector. If claude.ai is asking you to allow UserSim, allow it. If nothing is asking, check that a connector named <b>UserSim</b> exists in claude.ai → Settings → Connectors (URL <code>"+MCP_URL+"</code> with your token)."); },8000);
  const compP=call("usersim_competitors",{product_url:url,max_competitors:3}).then(o=>{ if(!live())return; P.competitors=o?.error?{error:o.error}:(o?.competitors||[]); $("comp").innerHTML=compSec(); mark("competitors"); })
    .catch(e=>{ if(live()){P.competitors={error:e?.message||"failed"}; $("comp").innerHTML=compSec();} });
  try{
    const st=await call("usersim_ph_quick_start",{product_url:url});
    if(!live())return;
    if(st?.error){ fail(st.error); return; }
    P.analysis=st.analysis; paint(); mark("analysis");
    // The website keeps one run record per simulation and each step updates it, so steps go one at a time.
    // A step that finds the record not written yet ("expired") spent nothing, so it is retried once.
    const tok=st.run_token, step=async k=>{ let o=await call("usersim_ph_quick_step",{run_token:tok,step:k});
      if(o?.error&&/expired/i.test(o.error)){ await new Promise(z=>setTimeout(z,1500)); o=await call("usersim_ph_quick_step",{run_token:tok,step:k}); }
      if(!live())return; P[k]=o?.error?{error:o.error}:o; paint(); mark(k); };
    for(const k of ["launch","people","reactions","asks"]) await step(k);
    await compP;
    if(live()) $("status").textContent=`Done in ${Math.round((Date.now()-t0)/1000)} s`;
  }catch(e){ if(live()){ clearInterval(tk); showError(e); } }
  finally{ clearInterval(tk); clearTimeout(dog); }
}
try{const L=JSON.parse($("last").textContent);$("url").value=L.label;render(L.payload);$("status").textContent="Example: "+L.label;}catch(e){}
$("f").onsubmit=async ev=>{ev.preventDefault();
  if(!HTTP&&!mcp){$("status").textContent="Connecting…";mcp=await mcpReady;}
  if(!HTTP&&!mcp){$("status").textContent="";setupMsg("Open this page in claude.ai to run it. "+addHelp);return;}
  const v=$("url").value.trim(); if(!v){$("status").textContent="Give a link.";return;}
  if(mode==="quick"&&/(^|\/\/|\.)producthunt\.com/i.test(v)){
    const slug=(v.match(/producthunt\.com\/(?:posts|products)\/([^/?#]+)/i)||[])[1];
    if(slug){ document.querySelector('.tab[data-mode="card"]').click(); $("url").value=slug.replace(/-/g," "); $("status").textContent="That's a Product Hunt launch, so this shows its launch card."; }
    else { setupMsg("That's Product Hunt itself. Paste <b>your product's own site</b> (e.g. https://yourproduct.com), or switch to <b>On Product Hunt now</b> and type a launch's name."); return; }
  }
  $("setup").hidden=true;
  try{const pm=await window.claude.use("permissions");if(pm){const st=await pm.state("mcp:"+SERVER).catch(()=>"unavailable");if(st!=="granted"&&st!=="unavailable")await pm.request(["mcp:"+SERVER]).catch(()=>{});}}catch{}
  if(!HTTP) try{ $("status").textContent="Checking the UserSim connector…"; const lt=await Promise.race([mcp.listTools(SERVER),new Promise(z=>setTimeout(()=>z(null),4000))]);
    const sv=lt?.servers?.find(x=>x.server===SERVER);
    if(lt&&!sv){ $("status").textContent=""; setupMsg("claude.ai says your account has <b>no connector named UserSim</b>, so this page can't reach the server. "+addHelp); return; }
    if(sv?.authStatus==="needs_reauth"){ $("status").textContent=""; setupMsg("Reconnect <b>UserSim</b> in claude.ai → Settings → Connectors, then try again."); return; }
  }catch(e){ if(e?.code&&e.code!=="bad_request"){ $("status").textContent=""; showError(e); return; } }
  $("run").disabled=true;
  try{
    if(mode==="quick"){ await runQuick(/^https?:/.test(v)?v:"https://"+v); }
    else { const t0=Date.now(); $("status").textContent="Loading the launch card…"; const isUrl=/^https?:\/\/|\.[a-z]{2,}(\/|$)/i.test(v);
      const p=await call("usersim_launch_card",isUrl?{product_url:v}:{name:v}); if(p?.error){$("status").textContent=p.error;} else {render(p);$("status").textContent=`Done in ${Math.round((Date.now()-t0)/1000)} s`;} }
  }catch(e){showError(e);}finally{$("run").disabled=false;}
};
