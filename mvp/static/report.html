<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>UserSim — Report</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/static/styles.css?v=65" />
</head>
<body>
  <header class="site-header">
    <a class="logo" href="/">UserSim</a>
    <a class="header-back" href="/">← Back to simulation</a>
  </header>

  <main class="main-url-first report-main">
    <p id="report-empty" class="brief-empty" hidden>
      No report yet. <a href="/">Run a simulation</a> first.
    </p>

    <section id="results" class="results" hidden>
      <section class="panel summary-panel">
        <h2 id="report-title">Study report</h2>
        <p id="access-info" class="access-info" hidden></p>
        <p id="report-email-note" class="email-status" hidden></p>
        <p id="headline" class="headline"></p>
        <p id="evidence-note" class="evidence-note" hidden></p>
        <div class="insight-grid">
          <div>
            <h4>Strengths</h4>
            <div id="strength-cards"></div>
          </div>
          <div>
            <h4>Weaknesses</h4>
            <div id="weakness-cards"></div>
          </div>
        </div>
        <div id="compare-block">
          <h4>Site comparison</h4>
          <p id="tie-note" class="tie-note" hidden></p>
          <div class="compare-wrap">
            <table id="compare-table"></table>
          </div>
        </div>
      </section>

      <section id="trace-panel" class="panel" hidden>
        <h2>Trace</h2>
        <p id="trace-meta" class="section-sub"></p>
        <div id="trace-viewer"></div>
      </section>
    </section>
  </main>

  <footer>
    <p>UserSim runs synthetic user simulations — a complement to, not a replacement for, real interviews.</p>
  </footer>

  <script src="/static/report.js?v=46"></script>
</body>
</html>
