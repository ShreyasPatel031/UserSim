<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Atelier · Product Hunt forecast</title>
<meta name="description" content="Our forecast of today's Product Hunt leaderboard next to the live board, with an honest track record.">
<link rel="icon" href="/atelier/logo.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baskervville:ital@0;1&family=Nunito+Sans:opsz,wght@6..12,300;6..12,400;6..12,600&display=swap">
<link rel="stylesheet" href="/static/ph_site.css?v=13">
</head>
<body>
<div class="wrap">
  <nav class="top" aria-label="Main">
    <a class="mark" href="/" aria-label="Atelier home"><img src="/atelier/logo.png" alt="" width="30" height="30">Atelier</a>
    <div class="menu label"><a href="/ph" aria-current="page">PH forecast</a><a href="/try">Try a product</a><a href="/app">Open app</a></div>
  </nav>

  <header class="head">
    <div class="copy">
      <p class="label" id="kicker">Product Hunt</p>
      <h1 id="title">Live Product Hunt user simulations</h1>
      <p class="metric" id="metric"></p>
    </div>
    <div class="daystep" role="group" aria-label="Launch day">
      <button type="button" id="day-prev" aria-label="Previous day"><svg width="16" height="16" viewBox="0 0 16 16" aria-hidden="true"><path d="M10 3 L5 8 L10 13" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
      <button type="button" id="day-label" class="daylabel" aria-haspopup="dialog" aria-expanded="false" aria-live="polite">—</button>
      <button type="button" id="day-next" aria-label="Next day"><svg width="16" height="16" viewBox="0 0 16 16" aria-hidden="true"><path d="M6 3 L11 8 L6 13" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
      <div class="daygrid" id="daygrid" role="dialog" aria-label="Pick a day" hidden></div>
    </div>
  </header>

  <div class="vs" id="vs">
    <section class="col" aria-labelledby="pred-h">
      <header class="colhead">
        <div><p class="label">Our call<span class="wide"> · user simulations</span></p><h2 id="pred-h">Predicted votes</h2></div>
        <div class="tabs" role="tablist" aria-label="Forecast">
          <button type="button" role="tab" id="tab-mid" data-v="mid">Product only</button>
          <button type="button" role="tab" id="tab-pre" data-v="pre">Product + comments</button>
        </div>
      </header>
      <ol class="board" id="pred" aria-live="polite"><li class="skeleton">Loading…</li></ol>
    </section>
    <div class="links" aria-hidden="true"><svg id="links"></svg></div>
    <section class="col" aria-labelledby="live-h">
      <header class="colhead">
        <div><p class="label" id="live-k">Product Hunt</p><h2 id="live-h">Live leaderboard</h2></div>
        <p class="stamp" id="live-stamp"></p>
      </header>
      <ol class="board" id="live" aria-live="polite"><li class="skeleton">Loading…</li></ol>
    </section>
  </div>
  <p class="legend small" id="legend"></p>
  <p class="acc small" id="acc"></p>
  <section class="whyp" id="whyp" hidden></section>

  <footer class="note label"><span>Forecasts by Atelier · not affiliated with Product Hunt</span><span id="asof"></span></footer>
</div>

<script>
const $ = (s) => document.querySelector(s);
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const GLYPH = [["Artificial Intelligence","✦"],["Developer Tools","{}"],["Open Source","◎"],["Design Tools","◐"],["Productivity","◷"],
  ["Marketing","↗"],["Sales","$"],["Fintech","$"],["Analytics","▤"],["Data & Analytics","▤"],["Mac","⌘"],["iOS","▯"],["Android","▯"],
  ["SaaS","☁"],["Video","▶"],["Audio","♪"],["Music","♪"],["Health & Fitness","+"],["Education","✎"],["Writing","✎"],["Games","◆"],
  ["Privacy","⊘"],["Security","⊘"],["Email","✉"],["Messaging","✉"],["Hardware","▣"],["Social Media","☺"],["Photography","◉"]];
function hash(s){let h=2166136261;for(const c of String(s))h=Math.imul(h^c.charCodeAt(0),16777619);return h>>>0;}
function icon(p){
  const letter = esc((p.name||"?").trim().charAt(0).toUpperCase());
  if(p.thumb) return `<div class="icon real"><img src="${esc(p.thumb)}" alt="" loading="lazy" width="56" height="56" referrerpolicy="no-referrer" onerror="this.parentNode.classList.remove('real');this.remove()"><span>${letter}</span></div>`;
  const h=hash(p.id||p.name), g=(GLYPH.find(([t])=>(p.topics||[]).includes(t))||[])[1]||"·";
  return `<div class="icon" style="--dot:${3+(h%4)}px;--dop:${(0.16+((h>>3)%5)*0.06).toFixed(2)}" aria-hidden="true"><span>${letter}</span><i>${esc(g)}</i></div>`;
}
let VIEW=null, TAB=null;
const link = (x)=> x.slug ? `<a href="https://www.producthunt.com/posts/${encodeURIComponent(x.slug)}" target="_blank" rel="noopener">${esc(x.name)}</a>` : esc(x.name);
const chips = (x)=> (x.topics||[]).slice(0,2).map(t=>`<span class="t">${esc(t)}</span>`).join("");

async function getJSON(url, ms){
  const ctl = new AbortController(), t = setTimeout(()=>ctl.abort(), ms || 25000);
  try {
    const r = await fetch(url, {signal: ctl.signal});
    const j = await r.json().catch(()=>null);
    if(!r.ok || !j) throw new Error((j && (j.error || j.detail)) || ("HTTP " + r.status));
    return j;
  } catch(e){ throw new Error(e.name === "AbortError" ? "timed out" : e.message); }
  finally { clearTimeout(t); }
}
function failed(sel, what, e){
  $(sel).innerHTML = `<li class="skeleton">Couldn't load ${esc(what)} (${esc(e.message)}). <a href="#" onclick="location.reload();return false">Retry</a></li>`;
}

async function load(day){
  let v;
  try { v = await getJSON("/api/ph/today" + (day ? "?day="+encodeURIComponent(day) : "")); }
  catch(e){
    if(VIEW && (!day || day === VIEW.day)){        // keep the last rendered board; say how old it is
      const at = VIEW.board && VIEW.board.as_of;
      $("#live-stamp").innerHTML = `<span class="tag">Couldn't refresh${at ? " · board from " + esc(ago(at)) : ""}</span>`;
      return;
    }
    failed("#pred", "the forecast", e); failed("#live", "the leaderboard", e); return;
  }
  VIEW = v;
  dayStep();
  const isToday = VIEW.day === VIEW.today, st = VIEW.status;

  $("#asof").textContent = st.final ? `Final ${st.as_of_pt}` : `Updated ${VIEW.board.as_of_pt || "—"}`;
  metric(); renderPred(); renderLive(); drawLinks();
}

// Match status: exact = same rank on both boards; near = in both top 10s at a different rank; miss = only on this board.
function status(predRank, realRank){
  if(!predRank || predRank > 10 || !realRank || realRank > 10) return "miss";
  return predRank === realRank ? "exact" : "near";
}
function row(pos, x, votes, voteLabel, st){
  return `<li class="row c ${st || ""}" data-id="${esc(x.id)}"><div class="pos">${Number(pos)}</div>${icon(x)}<div class="prod"><h3>${link(x)}</h3><p>${esc(x.tagline)}</p>
    <div class="chips">${chips(x)}</div></div>${votes!=null
      ? `<div class="vote"><span class="tri"></span><b>${esc(votes)}</b><small>${esc(voteLabel)}</small></div>`
      : `<div class="vote hidden"><span class="tri"></span><b>—</b><small>${esc(voteLabel)}</small></div>`}</li>`;
}

function liveTop(){
  return VIEW.launches.filter(x=>x.board_rank).sort((a,c)=>a.board_rank-c.board_rank).slice(0,10);
}

// Two forecasts only, both made before Product Hunt shows vote counts:
// "Midnight" = the 00:05 PT forecast; "Before votes" = the latest pre-reveal forecast (on time if one exists).
function pointFor(v){
  if(v === "mid") return VIEW.points.find(q=>q.key==="0005") || null;
  return VIEW.points.find(q=>q.key==="PRE") || null;   // the published 03:45 PT prediction only
}
function tabs(){
  const has = {mid: !!pointFor("mid"), pre: !!pointFor("pre")};
  if(!TAB) TAB = has.pre ? "pre" : "mid";      // a tab the visitor picks stays picked, even if its file is missing
  ["mid","pre"].forEach(v=>{ const b = $("#tab-"+v); b.setAttribute("aria-selected", String(TAB===v));
    const p = pointFor(v); b.title = p ? "Made " + p.time_pt : "Expected " + EXPECT[v];
    b.onclick = ()=>{ TAB = v; renderPred(); renderLive(); drawLinks(); }; });
}
const EXPECT = {mid: "00:05 PT", pre: "03:45 PT"};
function renderPred(){
  tabs();
  const p = pointFor(TAB);
  if(!p || p.fallback === "none_available"){
    $("#pred").innerHTML = `<li class="skeleton">${p ? "Not available for this day." : `Not yet available${VIEW.day === VIEW.today ? ` · expected ${EXPECT[TAB]}` : " for this day"}.`}</li>`;
    legend(); return;
  }
  const real = new Map(liveTop().map(x=>[x.id, x.board_rank]));
  const o = VIEW.launches.filter(x=>p.ranks[x.id]).sort((a,b)=>p.ranks[a.id]-p.ranks[b.id]).slice(0,10);
  const sts = o.map(x=>real.size ? status(p.ranks[x.id], real.get(x.id)) : "");
  $("#pred").innerHTML = o.map((x, i)=>{
    const ev = p.exp_votes && p.exp_votes[x.id];
    return row(p.ranks[x.id], x, ev!=null ? "~" + Number(ev) : null, "est.", sts[i]);
  }).join("");
  legend(sts);
  document.querySelectorAll("#pred .row").forEach(li=>li.onclick=(e)=>{ if(e.target.closest("a")) return; showWhy(li.dataset.id, p.key); });
}

// Fallback codes (PH ops bundle 12a) in plain words (E5).
const FALLBACK = {
  clean_nosite_fallback: "made by our previous midnight model (the main model's inputs were not ready)",
  no_prior: "made without the midnight forecast; Product Hunt's hidden order and comments only",
  hidden_rank_only: "Product Hunt's hidden order as is (our adjustments were unavailable)",
  midnight_order: "no pre-reveal read was available, so this repeats the midnight forecast",
  earlier_forecast: "the published model had no data, so this is our earlier midnight forecast",
};
function accLine(){
  const p = pointFor(TAB);
  if(!p || p.fallback === "none_available"){ $("#acc").textContent = ""; return; }
  const earlier = false;
  const name = TAB === "mid" ? "Product only (00:05 PT)" : "Product + comments (03:45 PT)";
  const made = p.time_pt ? ` · made ${p.time_pt}` : "";
  const fb = p.fallback ? ` · ${FALLBACK[p.fallback] || "a fallback model was used"}` : "";
  const pc = (v, r)=> r.approx ? `about ${Math.round(v)}%` : `${Number(v).toFixed(1)}%`;
  let acc = "";
  if(!earlier){
    // The track record (per-day hits against the official rank) wins; the file's own line only when there is none.
    acc = (((VIEW.accuracy||{})[TAB]) || []).map(r=>`${r.flag}${r.days ? ` on ${Number(r.days)} days` : ""}: top 3 ${pc(r.top3, r)} · top 5 ${pc(r.top5, r)} · top 10 ${pc(r.top10, r)}${r.note ? ` (${r.note})` : ""}`).join("; ")
      || p.backtest_line || "";
    if(acc && p.fallback) acc += " (this day used a fallback)";
  }
  const flag = VIEW.input_flag ? ` · Note: this day's prediction was ${VIEW.input_flag}` : "";
  $("#acc").textContent = `${name}${made}${fb}${acc ? " — " + acc : ""}${flag}`;
}
function metric(){
  const rows = ((VIEW.accuracy||{}).mid) || [];
  const cur = rows.find(x=>x.flag==="live"), prev = rows.find(x=>x.flag==="live, previous model");
  const r = cur || prev;
  if(r) $("#metric").innerHTML = `So far our user simulations have predicted <span class="live"><span class="dot" aria-hidden="true"></span><b>${Number(r.top10).toFixed(1)}%</b></span> of each day's top 10 before public votes.`
    + (cur ? "" : ` <span class="mnote">Previous model, live, ${Number(prev.days)} days.</span>`);
}
function legend(sts){
  accLine();
  const n = (k)=> (sts||[]).filter(v=>v===k).length;
  let h = sts && sts.some(Boolean)
    ? `<span class="key exact"></span>Exact rank ${n("exact")}<span class="key near"></span>In top 10, other rank ${n("near")}<span class="key miss"></span>Missed ${n("miss")}${VIEW.status.final ? "" : " · so far"}`
    : "";
  if(VIEW.status.final){
    const sc = (v, name)=>{ const p = pointFor(v); return p && p.score ? `<span class="final">${name}: top 3 ${p.score["3"]}/3 · top 5 ${p.score["5"]}/5 · top 10 ${p.score["10"]}/10</span>` : ""; };
    h += sc("mid", "Product only") + sc("pre", "Product + comments");
  }
  $("#legend").innerHTML = h;
}
function ago(iso){
  const m = Math.max(0, Math.round((Date.now() - Date.parse(iso)) / 60000));
  return m < 1 ? "just now" : m < 60 ? `${m} min ago` : `${Math.floor(m/60)} h ${m%60} min ago`;
}

function renderLive(){
  const b = VIEW.board, fin = VIEW.status.final;
  $("#live-h").textContent = fin ? "Final leaderboard" : "Live leaderboard";
  const fr = VIEW.freshness || {};
  $("#live-stamp").innerHTML = fin ? (b.as_of_pt ? `Final <b>${esc(b.as_of_pt)}</b>` : "Final")
    : b.source === "Product Hunt API" && b.as_of
      ? (b.votes_hidden ? `Votes hidden by Product Hunt until 04:00 PT<br>` : "") + `<span class="${fr.board_stale ? "tag" : ""}">Updated ${esc(ago(b.as_of))}</span>`
      : fr.board_stale ? `<span class="tag">${esc(fr.board_stale_label)}</span>`
      : b.as_of_pt ? `Updated <b>${esc(b.as_of_pt)}</b>` : "";
  const lead = pointFor(TAB);
  const ranks = lead ? lead.ranks : {};
  $("#live").innerHTML = liveTop().map(x=>row(x.board_rank, x, x.board_votes!=null ? Number(x.board_votes) : null,
      x.board_votes!=null ? "votes" : (fin ? "final" : "hidden"), lead ? status(ranks[x.id], x.board_rank) : "")).join("")
    || `<li class="skeleton">${fin ? "No line-up for this day." : "The board appears after the 00:01 PT launch."}</li>`;
}

function drawLinks(){
  const svg = $("#links"), box = svg.parentNode.getBoundingClientRect();
  svg.setAttribute("width", box.width); svg.setAttribute("height", box.height);
  const right = new Map([...document.querySelectorAll("#live .row")].map(li=>[li.dataset.id, li]));
  const paths = [...document.querySelectorAll("#pred .row")].map(li=>{
    const r = right.get(li.dataset.id);
    if(!r || box.width < 8) return "";
    const a = li.getBoundingClientRect(), c = r.getBoundingClientRect();
    const y1 = a.top + a.height/2 - box.top, y2 = c.top + c.height/2 - box.top, w = box.width;
    const k = li.classList.contains("exact") ? "exact" : "near";
    return `<g class="${k}"><path d="M0 ${y1} C ${w*0.5} ${y1}, ${w*0.5} ${y2}, ${w} ${y2}"/><circle cx="0" cy="${y1}" r="3"/><circle cx="${w}" cy="${y2}" r="3"/></g>`;
  }).join("");
  svg.innerHTML = paths;
}
window.addEventListener("resize", ()=>{ if(VIEW) drawLinks(); });

function showWhy(id, key){
  const html = whyBlock(id, key), x = VIEW.launches.find(l=>l.id===id), el = $("#whyp");
  if(!html){ el.hidden = true; return; }
  el.hidden = false; el.innerHTML = `<h3>Why: ${esc(x ? x.name : "")}</h3>` + html;
  el.querySelector("details") && (el.querySelector("details").open = true);
}

// Day stepper: VIEW.days is newest first; "previous" goes back in time.
function dayStep(){
  const d = VIEW.days, i = d.indexOf(VIEW.day);
  const fmt = new Date(VIEW.day + "T12:00:00").toLocaleDateString("en-US", {weekday: "short", month: "short", day: "numeric"});
  $("#day-label").textContent = VIEW.day === VIEW.today ? `Today · ${fmt}` : fmt;
  $("#day-prev").disabled = i < 0 || i >= d.length - 1;
  $("#day-next").disabled = i <= 0;
}
function dayGrid(){
  const g = $("#daygrid"), have = new Set(VIEW.days);
  const days = [...VIEW.days].sort();
  if(!days.length){ g.innerHTML = ""; return; }
  const months = [...new Set(days.map(d=>d.slice(0,7)))];
  g.innerHTML = months.map(m=>{
    const first = new Date(m + "-01T12:00:00"), lead = (first.getDay() + 6) % 7;   // Monday-first
    const last = new Date(first.getFullYear(), first.getMonth() + 1, 0).getDate();
    const cells = Array.from({length: lead}, ()=>`<span></span>`).concat(Array.from({length: last}, (_, i)=>{
      const d = `${m}-${String(i + 1).padStart(2, "0")}`;
      return have.has(d) ? `<button type="button" data-d="${d}" aria-pressed="${d===VIEW.day}"${d===VIEW.today ? ' class="today"' : ""}>${i + 1}</button>` : `<span class="off">${i + 1}</span>`;
    }));
    return `<div class="month"><p class="label">${first.toLocaleDateString("en-US", {month: "long", year: "numeric"})}</p>
      <div class="dow"><span>M</span><span>T</span><span>W</span><span>T</span><span>F</span><span>S</span><span>S</span></div><div class="cells">${cells.join("")}</div></div>`;
  }).reverse().join("");
  g.querySelectorAll("button[data-d]").forEach(b=>b.onclick=()=>{ closeGrid(); $("#whyp").hidden = true; TAB = null; load(b.dataset.d); });
}
function closeGrid(){ $("#daygrid").hidden = true; $("#day-label").setAttribute("aria-expanded", "false"); }
$("#day-label").onclick = (e)=>{ e.stopPropagation(); const g = $("#daygrid");
  if(g.hidden){ dayGrid(); g.hidden = false; $("#day-label").setAttribute("aria-expanded", "true"); } else closeGrid(); };
document.addEventListener("click", (e)=>{ if(!e.target.closest(".daystep")) closeGrid(); });
document.addEventListener("keydown", (e)=>{ if(e.key === "Escape") closeGrid(); });
function goDay(step){
  const d = VIEW.days, i = d.indexOf(VIEW.day), j = i + step;
  if(j < 0 || j >= d.length) return;
  $("#whyp").hidden = true; TAB = null; load(d[j]);
}
$("#day-prev").onclick = ()=>goDay(1);
$("#day-next").onclick = ()=>goDay(-1);
load();
// The board is read from Product Hunt's API at most once a minute on the server; poll at the same pace.
const ptToday = ()=> new Intl.DateTimeFormat("en-CA", {timeZone: "America/Los_Angeles"}).format(new Date());
setInterval(()=>{
  if(!VIEW || document.hidden) return;
  if(VIEW.day === VIEW.today && ptToday() !== VIEW.today){ TAB = null; load(); return; }   // midnight PT: move to the new day
  if(VIEW.day === VIEW.today && !VIEW.status.final) load(VIEW.day);
}, 60*1000);
document.addEventListener("visibilitychange", ()=>{ if(!document.hidden && VIEW && VIEW.day === VIEW.today && ptToday() !== VIEW.today){ TAB = null; load(); } });
</script>
</body>
</html>
