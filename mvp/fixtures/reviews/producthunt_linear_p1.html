goUuid":"9d9aa008-ca0e-4f10-84a1-211ae6875f45.png","isNoLongerOnline":false},"questionAnswers":[],"selectedPros":[{"__typename":"ReviewAiProConTag","id":"454","name":"project management","type":"Positive","count":41},{"__typename":"ReviewAiProConTag","id":"888","name":"clean interface","type":"Positive","count":46},{"__typename":"ReviewAiProConTag","id":"3185","name":"issue tracking","type":"Positive","count":24}],"selectedCons":[],"alternativeProducts":[],"commentsCount":0,"llmContentQualityGrade":null,"llmContentQualityReason":null,"threads":{"__typename":"CommentConnection","totalCount":0,"edges":[],"pageInfo":{"__typename":"PageInfo","endCursor":null,"hasNextPage":false}},"hasVoted":false,"votesCount":0,"canReply":false,"canUpdate":false,"canDestroy":false,"isHidden":null,"canModerate":false,"impressionCount":32},{"__typename":"DetailedReview","id":"203515","structuredData":{"@type":"Review","@id":"https://www.producthunt.com/products/linear/reviews?review=203515","itemReviewed":{"@id":"https://www.producthunt.com/products/linear"},"reviewRating":{"@type":"Rating","ratingValue":4,"bestRating":5,"worstRating":1},"reviewBody":"I’ve used linear at 2 companies now. Overall there’s lots to like about it and it’s my 'Go to' project management tool, but it has some frustrating rough edges that would be nice to see polished!\n\nGood/Great:\n- Generally it has just the right amount of complexity for running small-medium projects. I’ve only really seen it in action within a single team scope - think running larger multi teams projects would be more challenging\n- The design is opinionated without generally being overly restrictive. At the moment, we switch back and forth between kanban and scrum quite regularly and even then i don’t find it gets in the way too much.\n- I love the burndown graphs and find them very motivating\n\nAreas for improvement:\n- There are some very frustrating snags around cycle times that i’ve found really get in the way. Basically the best way to do what i want is to run cycles that correspond to the day after we do the cycle and then manually advance it. This is really unintuitive!\n- If you open a ticket within a project view, it sets the project as the last project not the project you’re in - so confusing!\n- the number of times people on the team are confused as to why they can’t see tickets and where they’ve gone due to some quirk of the UI is frustrating!","positiveNotes":{"@type":"ItemList","itemListElement":[{"@type":"ListItem","name":"project management"},{"@type":"ListItem","name":"sprint planning"}]},"negativeNotes":{"@type":"ItemList","itemListElement":[{"@type":"ListItem","name":"confusing structure"}]},"datePublished":"2025-01-27T10:03:09.695-08:00","dateModified":"2026-01-19T00:48:01.314-08:00","author":{"@type":"Person","name":"Emma Burrows","image":"https://ph-avatars.imgix.net/8068528/6855a94e-2eef-436b-93a1-1c4a9e02c33c.jpeg?auto=format\u0026crop=faces\u0026fit=crop\u0026h=100\u0026w=100","url":"https://www.producthunt.com/@emma_burrows1"},"url":"https://www.producthunt.com/products/linear/reviews?review=203515"},"reviewType":"personal","status":"submitted","overallRating":4,"easeOfUseRating":null,"reliabilityRating":null,"valueForMoneyRating":null,"customizationRating":null,"overallExperience":"I’ve used linear at 2 companies now. Overall there’s lots to like about it and it’s my 'Go to' project management tool, but it has some frustrating rough edges that would be nice to see polished!\n\nGood/Great:\n- Generally it has just the right amount of complexity for running small-medium projects. I’ve only really seen it in action within a single team scope - think running larger multi teams projects would be more challenging\n- The design is opinionated without generally being overly restrictive. At the moment, we switch back and forth between kanban and scrum quite regularly and even then i don’t find it gets in the way too much.\n- I love the burndown graphs and find them very motivating\n\nAreas for improvement:\n- There are some very frustrating snags around cycle times that i’ve found really get in the way. Basically the best way to do what i want is to run cycles that correspond to the day after we do the cycle and then manually advance it. This is really unintuitive!\n- If you open a ticket within a project view, it sets the project as the last project not the project you’re in - so confusing!\n- the number of times people on the team are confused as to why they can’t see tickets and where they’ve gone due to some quirk of the UI is frustrating!","positiveFeedback":null,"negativeFeedback":null,"alternativesFeedback":null,"createdAt":"2025-01-27T10:03:09-08:00","user":{"__typename":"User","id":"8068528","name":"Emma Burrows","username":"emma_burrows1","headline":"Founder of Rezonant.app","reviewsCount":2,"isFollowed":false,"avatarUrl":"https://ph-avatars.imgix.net/8068528/6855a94e-2eef-436b-93a1-1c4a9e02c33c.jpeg","isAccountVerified":false,"isAmbassador":false,"selectedByline":{"__typename":"UserByline","id":"120787","label":"Rezonant","imageUuid":"1a5b174f-588a-41ac-a2ed-91d51dcfd273.png","nonMakerByline":null,"product":{"__typename":"Product","id":"913255","name":"Rezonant","slug":"portia-ai","logoUuid":"1a5b174f-588a-41ac-a2ed-91d51dcfd273.png","isNoLongerOnline":false}},"canCrawl":false,"topProductBadge":null,"topHunterBadge":null,"topLaunchBadge":null},"fromPost":null,"product":{"__typename":"Product","id":"111617","name":"Linear","slug":"linear","logoUuid":"9d9aa008-ca0e-4f10-84a1-211ae6875f45.png","isNoLongerOnline":false},"followProduct":{"__typename":"Product","id":"111617","isSubscribed":false,"slug":"linear","name":"Linear","logoUuid":"9d9aa008-ca0e-4f10-84a1-211ae6875f45.png","isNoLongerOnline":false},"questionAnswers":[],"selectedPros":[{"__typename":"ReviewAiProConTag","id":"454","name":"project management","type":"Positive","count":41},{"__typename":"ReviewAiProConTag","id":"3382","name":"sprint planning","type":"Positive","count": 515","itemReviewed":{"@id":"https://www.producthunt.com/products/linear"},"reviewRating":{"@type":"Rating","ratingValue":4,"bestRating":5,"worstRating":1},"reviewBody":"I’ve used linear at 2 companies now. Overall there’s lots to like about it and it’s my 'Go to' project management tool, but it has some frustrating rough edges that would be nice to see polished!\n\nGood/Great:\n- Generally it has just the right amount of complexity for running small-medium projects. I’ve only really seen it in action within a single team scope - think running larger multi teams projects would be more challenging\n- The design is opinionated without generally being overly restrictive. At the moment, we switch back and forth between kanban and scrum quite regularly and even then i don’t find it gets in the way too much.\n- I love the burndown graphs and find them very motivating\n\nAreas for improvement:\n- There are some very frustrating snags around cycle times that i’ve found really get in the way. Basically the best way to do what i want is to run cycles that correspond to the day after we do the cycle and then manually advance it. This is really unintuitive!\n- If you open a ticket within a project view, it sets the project as the last project not the project you’re in - so confusing!\n- the number of times people on the team are confused as to why they can’t see tickets and where they’ve gone due to some quirk of the UI is frustrating!","positiveNotes":{"@type":"ItemList","itemListElement":[{"@type":"ListItem","name":"project management"},{"@type":"ListItem","name":"sprint planning"}]},"negativeNotes":{"@type":"ItemList","itemListElement":[{"@type":"ListItem","name":"confusing structure"}]},"datePublished":"2025-01-27T10:03:09.695-08:00","dateModified":"2026-01-19T00:48:01.314-08:00","author":{"@type":"Person","name":"Emma Burrows","image":"https://ph-avatars.imgix.net/8068528/6855a94e-2eef-436b-93a1-1c4a9e02c33c.jpeg?auto=format\u0026crop=faces\u0026fit=crop\u0026h=100\u0026w=1
