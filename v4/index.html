  --t0:#59606e; --t1:#d4572a; --t2:#2d8f8a; --t3:#8a4fd1;
  --display:"Bricolage Grotesque",ui-sans-serif,system-ui,sans-serif;
  --body:"Geist",ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;

  --r:10px;
}

  --accent:#7c93ff; --accent-ink:#0f1115; --hi:#5a4a10; --hi-ink:#ffe9a6;
  --ok:#4cc38a; --warn:#e7a43b; --bad:#ef7b7b; --okbg:#173326; --badbg:#3a1d1f; --warnbg:#3a2c14;
  --t0:#a3abb9; --t1:#ff8a5c; --t2:#4fc9c2; --t3:#b48cff; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0f1115; --panel:#171a20; --ink:#e9ebf0; --muted:#9aa2b1; --line:#2a2f39; --sunk:#1d2129;
  --accent:#7c93ff; --accent-ink:#0f1115; --hi:#5a4a10; --hi-ink:#ffe9a6;
  --ok:#4cc38a; --warn:#e7a43b; --bad:#ef7b7b; --okbg:#173326; --badbg:#3a1d1f; --warnbg:#3a2c14;
  --t0:#a3abb9; --t1:#ff8a5c; --t2:#4fc9c2; --t3:#b48cff; color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
html{scroll-behavior:smooth}
body{background:var(--bg);color:var(--ink);font:15px/1.55 var(--body);margin:0;overflow-x:hidden}
.wrap{max-width:1180px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:28px 120px;display:grid;grid-template-columns:minmax(0,1fr);gap:48px}
.wrap>*{min-width:0}
h1,h2,h3{font-family:var(--display);text-wrap:balance;margin:0;letter-spacing:-.01em}
h1{font-size:clamp(26px,4vw,40px);line-height:1.08;font-weight:700}
h2{font-size:22px;font-weight:700}
h3{font-size:16px;font-weight:600;font-family:var(--body)}
p{margin:0}
.eyebrow{font:500 12px/1 var(--mono);letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.muted{color:var(--muted)}
section>header{display:grid;gap:6px;margin-bottom:16px}
section>header p{color:var(--muted);max-width:70ch}
button{font:inherit;color:inherit;cursor:pointer}
a{color:var(--accent)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.chip{display:inline-flex;align-items:center;gap:6px;padding:3px 9px;border-radius:99px;background:var(--panel);border:1px solid var(--line);font-size:12.5px;white-space:nowrap}
.dot{width:9px;height:9px;border-radius:50%;flex:none;display:inline-block}
.pill{display:inline-flex;align-items:center;gap:5px;font:500 11.5px var(--mono);padding:2px 7px;border-radius:5px;background:var(--sunk);color:var(--muted);max-width:100%;overflow-wrap:anywhere}
.pill.ev{background:var(--warnbg);color:var(--warn)}
.pill.risk{background:var(--badbg);color:var(--bad)}
.hero{display:grid;gap:14px}
.hero .lede{font-size:17px;max-width:74ch}
.disclose{display:flex;gap:10px;align-items:flex-start;background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;font-size:14px;max-width:90ch}
.disclose .badge{flex:none;font:600 11px var(--mono);letter-spacing:.06em;background:var(--ink);color:var(--bg);padding:3px 7px;border-radius:5px;margin-top:2px}
.who{display:flex;gap:8px;flex-wrap:wrap}
.decisions{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.drow{border-top:1px solid var(--line)}
.drow:first-child{border-top:0}
.drow.top{background:color-mix(in srgb,var(--accent) 5%,var(--panel))}
.drow.top .rank{color:var(--accent)}
.dhead{display:grid;grid-template-columns:34px minmax(0,1fr) auto;gap:12px;align-items:center;padding:14px 16px 6px}
.rank{font:700 20px var(--display);color:var(--muted);text-align:center}
.dtitle{display:grid;gap:5px;min-width:0}
.dtitle h3{font-size:15.5px}
.dmeta{display:flex;gap:6px;flex-wrap:wrap}
.dact{display:flex;gap:6px;align-items:center;flex-wrap:wrap;justify-content:flex-end}
.btn{border:1px solid var(--line);background:var(--panel);padding:7px 12px;border-radius:8px;font-size:13px;font-weight:500;white-space:nowrap}
.btn.yes[aria-pressed="true"]{background:var(--ok);border-color:var(--ok);color:var(--panel)}
.btn.no[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:var(--bg)}
.btn.more{border-color:transparent;color:var(--accent);padding-inline:6px}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.morewrap{padding:0 16px 8px 62px}
.dbody{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.2fr);gap:18px;padding:4px 16px 18px 62px}
@media (max-width:860px){.dhead{grid-template-columns:28px minmax(0,1fr)}.dact{grid-column:2;justify-content:flex-start}.dbody{grid-template-columns:1fr;padding-left:16px}.morewrap{padding-left:56px}}
.why{display:grid;gap:10px;align-content:start;min-width:0}
.conflict{font-size:13px;color:var(--warn);background:var(--warnbg);padding:6px 10px;border-radius:6px}
.note{width:100%;min-height:58px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink);font:13.5px var(--body);padding:8px;resize:vertical}
.q{margin:0;padding:2px 0 2px 12px;border-left:3px solid var(--qc,var(--line));font-size:14px;cursor:pointer}
.q:hover{background:var(--sunk)}
.q small{display:block;color:var(--muted);font:11px var(--mono);margin-top:2px}
.q.delight{--qc:var(--ok)}.q.friction{--qc:var(--bad)}.q.competitor{--qc:var(--accent)}
.zoom{position:relative;width:100%;max-width:100%;overflow:hidden;border-radius:8px;border:1px solid var(--line);background:var(--sunk);cursor:ew-resize;touch-action:none;user-select:none}
.zlayer{position:absolute;inset:0;overflow:hidden}
.zin{position:absolute;container-type:inline-size}
.mock{position:absolute;border-radius:6px;white-space:nowrap;box-shadow:0 0 0 2px var(--accent),0 6px 18px rgba(0,0,0,.18);display:grid;place-items:center;text-align:center;font-weight:600;font-family:var(--body);padding:0 6px;overflow:hidden;font-size:1.15cqw;line-height:1.2}
.zhandle{position:absolute;top:0;bottom:0;width:2px;background:var(--accent);box-shadow:0 0 0 1px var(--panel);pointer-events:none}
.zhandle::after{content:"⇆";position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);width:28px;height:28px;border-radius:50%;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;font-size:14px}
.zlab{position:absolute;top:8px;font:600 11px var(--mono);padding:2px 6px;border-radius:4px;background:var(--ink);color:var(--bg);pointer-events:none}
.zlab.l{left:8px}.zlab.r{right:8px;background:var(--accent);color:var(--accent-ink)}
.zcap{font:11.5px var(--mono);color:var(--muted)}
.race{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:16px;display:grid;gap:14px}
.rrow{display:grid;grid-template-columns:160px minmax(0,1fr);gap:12px;align-items:center}
@media (max-width:640px){.rrow{grid-template-columns:1fr}}
.rname{font-size:14px;font-weight:500;display:flex;align-items:center;gap:7px}
.rname small{display:block;font:11px var(--mono);color:var(--muted);font-weight:400}
.bars{display:grid;gap:5px;min-width:0}
.bar{display:grid;grid-template-columns:78px minmax(0,1fr) 132px;}

.bar{gap:8px;align-items:center;font:12px var(--mono);color:var(--muted)}
.track{display:flex;gap:1px;height:16px;min-width:0}
.seg{flex:1 1 0;min-width:0;height:100%;border:0;padding:0;border-radius:2px;cursor:pointer}
.seg:hover{outline:2px solid var(--ink)}
.res{white-space:nowrap;text-align:right;font-weight:600}
.res.completed{color:var(--ok)}.res.blocked,.res.gave_up{color:var(--bad)}
.legend{display:flex;gap:12px;flex-wrap:wrap;font-size:12px;color:var(--muted)}
.modes{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:12px}
.segc{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow-x:auto;background:var(--panel);max-width:100%;flex-wrap:nowrap;scrollbar-width:none}
.segc button{border:0;background:transparent;padding:6px 11px;font-size:13px;white-space:nowrap}
.segc button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.theatre{display:grid;grid-template-columns:minmax(0,1fr) 320px;gap:16px;align-items:start}

.stagebox{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:12px;display:grid;gap:10px;min-width:0}
.screen{position:relative;width:100%;aspect-ratio:16/10;max-width:100%;border-radius:8px;overflow:hidden;background:var(--sunk);border:1px solid var(--line)}
.shot{position:absolute;inset:0;background-repeat:no-repeat;background-size:100% auto}
.ripple{position:absolute;width:34px;height:34px;margin:-17px 0 0 -17px;border-radius:50%;border:3px solid var(--accent);box-shadow:0 0 0 6px color-mix(in srgb,var(--accent) 25%,transparent);pointer-events:none}
.ripple.anim{animation:rip .9s ease-out}
@keyframes rip{0%{transform:scale(.3);opacity:0}30%{opacity:1}100%{transform:scale(1);opacity:1}}

.pbar{display:flex;align-items:center;gap:10px}

.ticks{flex:1;height:28px;display:flex;gap:2px;align-items:stretch;min-width:0}

d none.", "quotes": [{"run": "group-2__task1", "step": 7, "kind": "delight", "text": "Wow, that created a connected box with a bound arrow in one keystroke, faster than draw.io."}, {"run": "group-2__task1", "step": 16, "kind": "friction", "text": "Read-only, no indication of how long the link lives or any API/GitHub embed. I'd need Excalidraw+ for that, and pricing isn't visible."}, {"run": "group-2__comp1", "step": 32, "kind": "competitor", "text": "'Anyone with the link: Editor' by default. That's more open than Figma's default, but it's what I want for a teammate."}], "expects": ["Pricing and plan limits", "API / GitHub integration", "Mermaid-like speed: met"]}, "group-3": {"summary": "Skipped the labels, used the shortcut, and had a link in 8 steps. The fastest run of the session, and the one most likely to leave if anything had blocked it.", "quotes": [{"run": "group-3__task1", "step": 4, "kind": "delight", "text": "Whoa, that's slick, it made a second box already connected with an arrow."}, {"run": "group-3__task1", "step": 3, "kind": "friction", "text": "My box ended up further left than I dragged and half hidden under the style panel, a bit weird."}, {"run": "group-3__comp1", "step": 21, "kind": "competitor", "text": "That icon only gives Export as an image, and the preview is a weird pinkish strip. Kinda annoying, Excalidraw lets me share without an account."}], "expects": ["Value before signup: met", "Is there an iOS app?", "Is it open source?"]}}, "divergences": [{"id": "d1", "severity": "high", "kind": "competitor", "title": "No account needed is Excalidraw's edge over tldraw, but it is said too quietly to count", "summary": "On tldraw all 4 testers hit a sign-in wall to share (12 to 15 extra steps; Makers were blocked). On Excalidraw, 2 of 4 noticed 'no account needed', in small text under the button. Nothing in the main share flow says it plainly.", "groups": ["group-1", "group-2", "group-3", "plain-tester"], "moments": [{"run": "group-1__comp1", "step }], "disclosure": "The 4 testers are AI agents using the real sites in real browsers. Each group tester's persona is built from the profiles of thousands of real Product Hunt users. One run per tester per product: a fast first pass to choose what to test for real, not a validation.", "method": ["A step is one action (a click, a key press, typing). Opening the page is step 0. 'Got the link' means the tester ended with a shareable link; the Observers' chart had no box labels and still counts.", "Real products, real browsers: 8 sessions on excalidraw.com and tldraw.com, in Camoufox on UserSim's own machines, every action and screenshot recorded.", "Simulated people: a plain QA tester plus 3 groups clustered from about 93,000 Product Hunt users read in full (activity, launches, comments, topics). 'Built from 6,500 people' means the persona summarises that cluster; it is still one simulated run.", "Priority = how many testers hit it \u00d7 how bad it was (blocked > hesitated > slower > cosmetic), then effort.", "Measured accuracy so far: on 276 past launches, simulated group reactions covered 65% of the broad points real commenters raised but about 9% of exact issues. Behaviour inside a product has not been validated yet."], "race_title": "Actions to a shareable link: Excalidraw took 7 to 16, tldraw 30 to 35 behind a sign-in wall", "runs": {"group-1__comp1": {"outcome": "blocked", "notes": "Drawing part was easy and fast: no signup wall, R/A shortcuts work like Excalidraw/Figma, Enter-to-label on a selected box, arrows bind edge-to-edge to shapes and labels reflow on resize. Friction while drawing: clicking the toolbar rectangle icon did not seem to activate it (had to use R), one rectangle drag became a tiny box with the label wrapped into a skinny column (had to resize), and one arrow drag shot its endpoint to the top-right corner under the Share/style panel, where the handle could not be grabbed, so I undid it. Sharing is where it broke: the small share icon next to \"Sign in to share\" is only Export (PNG of the current selection, which previewed only my selected arrow), with no anonymous link, unlike Excalidraw's no-account share link. \"Sign in to share\" asks only for an email (good), but a Cloudflare Turnstile check gates Continue, and after passing it the form returned \"Too many verification code requests. Please try again later.\" on the first real attempt. No code email arrived after two 45 s waits. A second attempt gave the same rate-limit error. I could not get a shareable link, so the outcome is blocked.", "steps": [{"step": 0, "action": {"type": "navigate", "url": "https://www.tldraw.com"}, "thought": ""}, {"step": 1, "action": {"type": "click", "x": 797, "y": 768}, "thought": "Straight into a blank canvas, no signup wall. Nice, that's the Excalidraw-style zero-friction start I like. Grabbing the rectangle tool for box one."}, {"step": 2, "action": {"type": "drag", "x": 150, "y": 300, "to_x": 310, "to_y": 400}, "thought": "The toolbar didn't visibly highlight the rectangle, but I'll just drag and see if a box appears.", "friction": "Toolbar rectangle did not activate"}, {"step": 3, "action": {"type": "key", "keys": "r"}, "thought": "Nothing drew and the select tool is still highlighted. Hmm. Figma and Excalidraw both use R for rectangle, let me try the keyboard shortcut."}, {"step": 4, "action": {"type": "drag", "x": 150, "y": 300, "to_x": 310, "to_y": 400}, "thought": "R worked, rectangle tool is now blue. Drawing box one."}, {"step": 5, "action": {"type": "key", "keys": "Enter"}, "thought": "Box drawn, tool snapped back to select. I'll hit Enter to label it, like editing a node in Excalidraw."}, {"step": 6, "action": {"type": "type", "text": "Sign up"}, "thought": "Handles disappeared so I think I'm in text-edit mode. Typing step 1."}, {"step": 7, "action": {"type": "key", "keys": "Escape"}, "thought": "Label landed, centered, hand-drawn font. Escape to exit editing."}, {"step": 8, "action": {"type": "key", "keys"
